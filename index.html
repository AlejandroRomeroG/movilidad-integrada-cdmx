<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="color-scheme" content="dark light">
  <meta name="author" content="Alejandro Romero González">
  <meta name="description" content="Mapa interactivo de la Movilidad Integrada de la Ciudad de México: del mapa esquemático a la geografía real.">
  <title>Red de Movilidad Integrada de la CDMX</title>
  <script>
    (() => {
      try {
        if (localStorage.getItem("movilidad-integrada-cdmx-theme") === "light") {
          document.documentElement.dataset.mobilityTheme = "light";
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#ffffff");
        }
      } catch {}
    })();
  </script>
  <style>
    * { box-sizing: border-box; }

    html {
      --page-background: #05070a;
      --page-foreground: #f4f7fa;
      --page-muted: #9ba5af;
      --page-aura: rgba(74, 89, 104, 0.16);
      --dock-solid: #05070a;
      --dock-fade: rgba(5, 7, 10, 0.95);
      height: 100%;
      background: var(--page-background);
      color: var(--page-foreground);
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html[data-mobility-theme="light"] {
      --page-background: #ffffff;
      --page-foreground: #151a20;
      --page-muted: #5d6873;
      --page-aura: rgba(92, 116, 140, 0.1);
      --dock-solid: #ffffff;
      --dock-fade: rgba(255, 255, 255, 0.95);
      color-scheme: light;
    }

    body {
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-width: 320px;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% -20%, var(--page-aura), transparent 38rem),
        var(--page-background);
    }

    .site-shell {
      --page-gutter: clamp(0.75rem, 2.2vw, 2rem);
      --controls-reserve: 4.5rem;
      width: 100%;
      height: 100%;
      margin-inline: auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding-top: max(var(--page-gutter), env(safe-area-inset-top));
      padding-right: max(var(--page-gutter), env(safe-area-inset-right));
      padding-bottom: calc(var(--controls-reserve) + env(safe-area-inset-bottom));
      padding-left: max(var(--page-gutter), env(safe-area-inset-left));
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem 2rem;
      padding: 0.15rem 0 1rem;
    }

    .site-header h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.3vw, 1.8rem);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .site-header p {
      max-width: 38rem;
      margin: 0;
      color: var(--page-muted);
      font-size: clamp(0.78rem, 1.45vw, 0.94rem);
      text-align: right;
    }

    .site-intro {
      display: grid;
      justify-items: end;
      gap: 0.3rem;
    }

    .site-credit {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.38rem;
      color: var(--page-muted);
      font-size: clamp(0.7rem, 1.2vw, 0.8rem);
    }

    .site-credit-links {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
    }

    .site-credit a {
      display: inline-grid;
      width: 1.35rem;
      height: 1.35rem;
      place-items: center;
      color: var(--page-muted);
      border-radius: 50%;
    }

    .site-credit a:hover {
      color: var(--page-foreground);
    }

    .site-credit a:focus-visible {
      color: var(--page-foreground);
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .site-credit svg {
      display: block;
      width: 0.95rem;
      height: 0.95rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .site-credit .site-github-icon {
      fill: currentColor;
      stroke: none;
    }

    .site-main {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      container-type: size;
    }

    .site-main #metro-cdmx-morph {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .site-main #metro-cdmx-morph .metro-stage {
      width: min(100cqw, 126.5823cqh);
      aspect-ratio: 1000 / 790;
    }

    .site-main #metro-cdmx-morph .metro-map {
      width: 100%;
      height: 100%;
      max-height: none;
    }

    .site-main #metro-cdmx-morph .viz-controls {
      position: fixed;
      z-index: 10;
      inset-inline: 0;
      bottom: 0;
      width: 100%;
      margin-inline: auto;
      padding-top: 0.45rem;
      padding-right: max(var(--page-gutter), env(safe-area-inset-right));
      padding-bottom: calc(0.65rem + env(safe-area-inset-bottom));
      padding-left: max(var(--page-gutter), env(safe-area-inset-left));
      background: linear-gradient(to top, var(--dock-solid) 72%, var(--dock-fade));
    }

    @media (max-width: 680px) {
      .site-shell {
        --page-gutter: 0.65rem;
      }

      .site-header {
        display: block;
        padding-bottom: 0.7rem;
      }

      .site-header p {
        margin-top: 0.28rem;
        text-align: left;
      }

      .site-intro {
        justify-items: start;
      }

      .site-credit {
        justify-content: flex-start;
      }

    }

    @media (max-width: 680px) and (orientation: portrait) {
      .site-main {
        width: 100vw;
        margin-inline: calc(50% - 50vw);
      }

      .site-main #metro-cdmx-morph .metro-stage {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
      }

      .site-main #metro-cdmx-morph .metro-map {
        width: 100%;
        height: 100%;
      }

      .site-main #metro-cdmx-morph .metro-zoom-controls {
        top: 0;
        right: max(0.5rem, env(safe-area-inset-right));
      }

      .site-main #metro-cdmx-morph .metro-theme-button {
        top: 0;
        left: max(0.5rem, env(safe-area-inset-left));
      }

      .site-main #metro-cdmx-morph .metro-network-count {
        display: none;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .site-shell {
        --page-gutter: 0.45rem;
        --controls-reserve: 4.25rem;
      }

      .site-header {
        padding-bottom: 0.35rem;
      }

      .site-header h1 {
        font-size: 1rem;
      }

      .site-header p {
        margin-top: 0;
        font-size: 0.72rem;
      }

      .site-intro {
        gap: 0.1rem;
      }

      .site-credit {
        font-size: 0.66rem;
      }
    }

    @media (max-width: 680px) and (max-height: 620px) and (orientation: portrait) {
      .site-main #metro-cdmx-morph .metro-map {
        transform: translateY(1.5rem);
      }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <h1>Red de Movilidad Integrada de la CDMX</h1>
      <div class="site-intro">
        <p>Explora el mapa esquemático y su correspondencia con la geografía real</p>
        <div class="site-credit">
          <span>Hecho por: Alejandro Romero González</span>
          <span class="site-credit-links">
            <a href="https://alejandroromerog.github.io/" target="_blank" rel="noreferrer" aria-label="Sitio personal de Alejandro Romero González">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="9"></circle>

              </svg>
            </a>
            <a href="https://github.com/AlejandroRomeroG" target="_blank" rel="noreferrer" aria-label="GitHub de Alejandro Romero González">
              <svg class="site-github-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

              </svg>
            </a>
          </span>
        </div>
      </div>
    </header>
    <main class="site-main">
      <style>
  #metro-cdmx-morph {
    --map-background: #05070a;
    --map-foreground: #f4f7fa;
    --map-muted: #9ba5af;
    --map-tooltip-foreground: #f7f9fb;
    --map-tooltip-background: rgba(30, 34, 39, 0.97);
    --map-tooltip-border: rgba(255, 255, 255, 0.16);
    --map-tooltip-shadow: rgba(0, 0, 0, 0.38);
    --map-button-background: rgba(17, 21, 26, 0.96);
    --map-button-hover: rgba(45, 52, 60, 0.96);
    --map-button-border: rgba(255, 255, 255, 0.2);
    --map-focus: #ffffff;
    --map-administrative-fill: #0a0e13;
    --map-administrative-stroke: #46505b;
    --map-road: #27303a;
    --map-label: #8d99a5;
    --map-note: #d6dce2;
    --map-halo: #05070a;
    --map-station-fill: #05070a;
    --map-station-stroke: #f4f7fa;
    --map-badge-clearance: #05070a;
    width: 100%;
    color: var(--map-foreground);
    color-scheme: dark;
    background: var(--map-background);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #metro-cdmx-morph[data-theme="light"],
  html[data-mobility-theme="light"] #metro-cdmx-morph {
    --map-background: #ffffff;
    --map-foreground: #151a20;
    --map-muted: #5d6873;
    --map-tooltip-foreground: #151a20;
    --map-tooltip-background: rgba(255, 255, 255, 0.98);
    --map-tooltip-border: rgba(21, 26, 32, 0.2);
    --map-tooltip-shadow: rgba(35, 43, 51, 0.18);
    --map-button-background: rgba(255, 255, 255, 0.96);
    --map-button-hover: #e9eef2;
    --map-button-border: rgba(21, 26, 32, 0.24);
    --map-focus: #111820;
    --map-administrative-fill: #dfe5ea;
    --map-administrative-stroke: #81909e;
    --map-road: #b8c2cb;
    --map-label: #53606d;
    --map-note: #4f5a65;
    --map-halo: #cfd6dc;
    --map-station-fill: #ffffff;
    --map-station-stroke: #182028;
    --map-badge-clearance: #ffffff;
    color-scheme: light;
  }

  #metro-cdmx-morph .metro-stage {
    position: relative;
    width: 100%;
    overflow: hidden;
    contain: layout paint;
    touch-action: none;
    overscroll-behavior: contain;
    background: var(--map-background);
  }

  #metro-cdmx-morph .metro-map {
    display: block;
    width: 100%;
    height: auto;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: grab;
  }

  #metro-cdmx-morph .metro-stage[data-panning="true"] .metro-map {
    cursor: grabbing;
  }

  #metro-cdmx-morph .metro-tip {
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    transform: translate(-50%, calc(-100% - 10px));
    z-index: 2;
    box-sizing: border-box;
    inline-size: max-content;
    max-inline-size: min(22rem, calc(100% - 1rem));
    padding: 0.48rem 0.62rem;
    color: var(--map-tooltip-foreground);
    background: var(--map-tooltip-background);
    border: 1px solid var(--map-tooltip-border);
    border-radius: 0.55rem;
    box-shadow: 0 0.55rem 1.4rem var(--map-tooltip-shadow);
    font-size: 0.84rem;
  }

  #metro-cdmx-morph .metro-tip.is-visible {
    visibility: visible;
  }

  #metro-cdmx-morph .metro-tip-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-inline-size: 0;
    white-space: normal;
  }

  #metro-cdmx-morph .metro-tip-copy,
  #metro-cdmx-morph .metro-tip-label {
    min-inline-size: 0;
    overflow-wrap: anywhere;
  }

  #metro-cdmx-morph .metro-tip-copy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.12rem;
  }

  #metro-cdmx-morph .metro-tip-cycle {
    color: var(--map-muted);
    font-size: 0.72rem;
    line-height: 1.2;
    white-space: nowrap;
  }

  #metro-cdmx-morph .metro-tip-icon {
    display: block;
    width: 1.65rem;
    height: 1.65rem;
    flex: 0 0 auto;
    object-fit: contain;
  }

  #metro-cdmx-morph .metro-control {
    width: 100%;
    min-height: 1.7rem;
    margin: 0;
    accent-color: var(--map-foreground);
  }

  #metro-cdmx-morph .viz-controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0.18rem;
    padding: 0.7rem 0 0;
  }

  #metro-cdmx-morph .metro-range-labels {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    font-size: 0.9rem;
    font-weight: 500;
  }

  #metro-cdmx-morph .form-label {
    font-size: 0.9rem;
    font-weight: 500;
  }

  #metro-cdmx-morph .text-small {
    font-size: 0.82rem;
  }

  #metro-cdmx-morph .text-muted {
    color: var(--map-muted);
  }

  #metro-cdmx-morph .metro-theme-button {
    position: absolute;
    top: 0.8rem;
    left: 0.8rem;
    z-index: 3;
  }

  #metro-cdmx-morph .metro-zoom-controls {
    position: absolute;
    top: 0.8rem;
    right: 0.8rem;
    z-index: 3;
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 0.35rem;
  }

  #metro-cdmx-morph .metro-zoom-button,
  #metro-cdmx-morph .metro-theme-button {
    display: inline-grid;
    min-width: 2.35rem;
    height: 2.35rem;
    place-items: center;
    padding: 0 0.55rem;
    color: var(--map-foreground);
    background: var(--map-button-background);
    border: 1px solid var(--map-button-border);
    border-radius: 0.45rem;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }

  #metro-cdmx-morph .metro-zoom-button:hover,
  #metro-cdmx-morph .metro-theme-button:hover {
    background: var(--map-button-hover);
  }

  #metro-cdmx-morph .metro-zoom-button:focus-visible,
  #metro-cdmx-morph .metro-theme-button:focus-visible {
    outline: 2px solid var(--map-focus);
    outline-offset: 2px;
  }

  #metro-cdmx-morph .metro-zoom-button:disabled {
    opacity: 0.42;
    cursor: default;
  }

  #metro-cdmx-morph .metro-theme-icon {
    display: block;
    width: 1.1rem;
    height: 1.1rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #metro-cdmx-morph .metro-theme-icon-moon {
    display: none;
  }

  #metro-cdmx-morph[data-theme="light"] .metro-theme-icon-sun,
  html[data-mobility-theme="light"] #metro-cdmx-morph .metro-theme-icon-sun {
    display: none;
  }

  #metro-cdmx-morph[data-theme="light"] .metro-theme-icon-moon,
  html[data-mobility-theme="light"] #metro-cdmx-morph .metro-theme-icon-moon {
    display: block;
  }

  #metro-cdmx-morph .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  #metro-cdmx-morph .metro-line,
  #metro-cdmx-morph .metro-halo,
  #metro-cdmx-morph .metro-b-line,
  #metro-cdmx-morph .official-schematic-line,
  #metro-cdmx-morph .official-schematic-halo,
  #metro-cdmx-morph .mobility-line,
  #metro-cdmx-morph .mobility-halo {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  #metro-cdmx-morph .metro-station-dot,
  #metro-cdmx-morph .metro-station-hit,
  #metro-cdmx-morph .metro-badge,
  #metro-cdmx-morph .mobility-station-mark,
  #metro-cdmx-morph .mobility-badge {
    vector-effect: non-scaling-stroke;
  }

  #metro-cdmx-morph .metro-station-hit,
  #metro-cdmx-morph .mobility-station-hit {
    fill: transparent;
    pointer-events: none;
  }

  #metro-cdmx-morph .metro-station-dot,
  #metro-cdmx-morph .mobility-station-mark {
    cursor: crosshair;
    pointer-events: visiblePainted;
  }

  #metro-cdmx-morph [data-layer="badges"],
  #metro-cdmx-morph [data-layer="mobility-badges"] {
    pointer-events: none;
  }

  #metro-cdmx-morph .metro-badge-text {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-weight: 500;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  #metro-cdmx-morph .metro-map-note {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-weight: 500;
    letter-spacing: 0.08em;

  }

  #metro-cdmx-morph .metro-network-count {
    letter-spacing: 0.03em;
  }

  #metro-cdmx-morph .metro-stage[data-interacting="true"] .metro-line,
  #metro-cdmx-morph .metro-stage[data-interacting="true"] .metro-b-line,
  #metro-cdmx-morph .metro-stage[data-interacting="true"] .official-schematic-line,
  #metro-cdmx-morph .metro-stage[data-interacting="true"] .mobility-line {
    filter: none;
  }

  @media (pointer: coarse) {
    #metro-cdmx-morph .metro-line,
    #metro-cdmx-morph .metro-b-line,
    #metro-cdmx-morph .official-schematic-line,
    #metro-cdmx-morph .mobility-line {
      filter: none;
    }
  }

  #metro-cdmx-morph .metro-municipality-label {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-weight: 500;
    letter-spacing: 0.05em;

    paint-order: stroke;

  #metro-cdmx-morph .metro-map-background {
    fill: var(--map-background);
  }

  #metro-cdmx-morph .metro-administrative-boundary {
    fill: var(--map-administrative-fill);
    stroke: var(--map-administrative-stroke);
  }

  #metro-cdmx-morph .metro-road {
    stroke: var(--map-road);
  }

  #metro-cdmx-morph .official-schematic-halo,
  #metro-cdmx-morph .mobility-halo,
  #metro-cdmx-morph .metro-halo {
    stroke: var(--map-halo);
  }

  #metro-cdmx-morph .mobility-station-mark {
    fill: var(--map-station-fill);
  }

  #metro-cdmx-morph .metro-station-dot {
    fill: var(--map-station-fill);
    stroke: var(--map-station-stroke);
  }

  #metro-cdmx-morph .badge-clearance {
    fill: var(--map-badge-clearance);
  }

  #metro-cdmx-morph [data-layer="north"] path,
  #metro-cdmx-morph [data-layer="north"] text {
    fill: var(--map-note);
  }

  #metro-cdmx-morph[data-theme="light"] .metro-line,
  #metro-cdmx-morph[data-theme="light"] .metro-b-line,
  #metro-cdmx-morph[data-theme="light"] .official-schematic-line,
  #metro-cdmx-morph[data-theme="light"] .mobility-line,
  html[data-mobility-theme="light"] #metro-cdmx-morph .metro-line,
  html[data-mobility-theme="light"] #metro-cdmx-morph .metro-b-line,
  html[data-mobility-theme="light"] #metro-cdmx-morph .official-schematic-line,
  html[data-mobility-theme="light"] #metro-cdmx-morph .mobility-line {
    filter: none;
  }

  @media (max-width: 680px) and (orientation: portrait) {
    #metro-cdmx-morph .metro-stage {
      aspect-ratio: 704 / 771;
    }

    #metro-cdmx-morph .metro-map {
      height: 100%;
    }

    #metro-cdmx-morph .metro-network-count {
      display: none;
    }
  }

  @media (max-width: 480px) {

      Math.hypot(matrix.a, matrix.b),
      Math.hypot(matrix.c, matrix.d)
    );
    stationScreenGeometryCache = stationTipTargetList.map(target => {
      const [stationX, stationY] = target.station.current;
      const mapX = renderedZoomState.x + stationX * renderedZoomState.scale;
      const mapY = renderedZoomState.y + stationY * renderedZoomState.scale;
      const scale = renderedZoomState.scale * screenScale;
      const geometry = {
        target,
        x: matrix.a * mapX + matrix.c * mapY + matrix.e,
        y: matrix.b * mapX + matrix.d * mapY + matrix.f
      };
      if (target.shape.type === "rect") {
        geometry.halfWidth = target.shape.halfWidth * scale + target.shape.strokeWidth / 2;
        geometry.halfHeight = target.shape.halfHeight * scale + target.shape.strokeWidth / 2;
      } else {
        geometry.radius = target.shape.radius * scale + target.shape.strokeWidth / 2;
      }
      return geometry;
    });
    return stationScreenGeometryCache;
  }

  function pointFallsOnStation(item, clientX, clientY, tolerance = 0) {
    const dx = clientX - item.x;
    const dy = clientY - item.y;
    if (item.target.shape.type === "rect") {
      return Math.abs(dx) <= item.halfWidth + tolerance
        && Math.abs(dy) <= item.halfHeight + tolerance;
    }
    return Math.hypot(dx, dy) <= item.radius + tolerance;
  }

  function stationClusterAt(clientX, clientY, pointerType, fallbackTarget = null) {
    if (pointerType === "mouse" && !fallbackTarget) return null;
    const tolerance = pointerType === "touch" ? 5 : pointerType === "pen" ? 2 : 0.5;
    const geometries = currentStationScreenGeometries();
    let primary = fallbackTarget
      ? geometries.find(item => item.target === fallbackTarget) || null
      : null;
    if (!primary) {
      primary = geometries
        .filter(item => pointFallsOnStation(item, clientX, clientY, tolerance))
        .map(item => ({
          ...item,
          pointerDistance: Math.hypot(item.x - clientX, item.y - clientY)
        }))
        .sort((first, second) => first.pointerDistance - second.pointerDistance
          || second.target.order - first.target.order)[0]
        || null;
    }
    if (!primary) return null;

    const candidateTolerance = pointerType === "mouse" ? 0.5 : tolerance;
    const ranked = geometries
      .filter(item => item.target === primary.target
        || pointFallsOnStation(item, clientX, clientY, candidateTolerance)
        || Math.hypot(item.x - primary.x, item.y - primary.y) <= 1.25)
      .map(item => ({
        ...item,
        pointerDistance: Math.hypot(item.x - clientX, item.y - clientY)
      }))
      .sort((first, second) => {
        if (first.target === primary.target) return -1;
        if (second.target === primary.target) return 1;
        return first.pointerDistance - second.pointerDistance
          || second.target.order - first.target.order;
      });
    return {
      targets: ranked.map(item => item.target),
      primary: primary.target
    };
  }

  function stationSelectionAt(
    clientX,
    clientY,
    pointerType,
    frozenCluster = null
  ) {
    const cluster = frozenCluster
      || stationClusterAt(clientX, clientY, pointerType);
    if (!cluster) return null;
    const key = cluster.targets.map(target => target.key).sort().join("|");
    const repeatRadius = pointerType === "mouse" ? 3 : pointerType === "pen" ? 4 : 8;
    const repeatsCycle = stationSelectionCycle
      && stationSelectionCycle.key === key
      && stationSelectionCycle.primaryKey === cluster.primary.key
      && Math.hypot(
        clientX - stationSelectionCycle.clientX,
        clientY - stationSelectionCycle.clientY
      ) <= repeatRadius;
    const targets = repeatsCycle ? stationSelectionCycle.targets : cluster.targets;
    const index = repeatsCycle
      ? (stationSelectionCycle.index + 1) % targets.length
      : 0;
    stationSelectionCycle = {
      key,
      primaryKey: cluster.primary.key,
      targets,
      index,
      clientX: repeatsCycle ? stationSelectionCycle.clientX : clientX,
      clientY: repeatsCycle ? stationSelectionCycle.clientY : clientY
    };
    return { targets, index, pointerType, target: targets[index] };
  }

  function selectStationAt(
    clientX,
    clientY,
    pointerType,
    frozenCluster = null
  ) {
    const selection = stationSelectionAt(
      clientX,
      clientY,
      pointerType,
      frozenCluster
    );
    if (!selection) return null;
    revealStationTooltip(selection.target, true, selection);
    return selection.target;
  }

  function registerStationTooltip(hit, mark, render, station, key) {
    const strokeWidth = Number(mark.getAttribute("stroke-width")) || 0;
    const shape = mark.localName === "rect"
      ? {
          type: "rect",
          halfWidth: Number(mark.getAttribute("width")) / 2,
          halfHeight: Number(mark.getAttribute("height")) / 2,
          strokeWidth
        }
      : {
          type: "circle",
          radius: Number(mark.getAttribute("r")) || 0,
          strokeWidth
        };
    const target = {
      hit,
      mark,
      render,
      station,
      key,
      shape,
      order: stationTipTargetList.length
    };
    stationMarkTargets.set(mark, target);
    stationTipTargetList.push(target);
    stationScreenGeometryCache = null;
    mark.addEventListener("pointerenter", event => {
      if (event.pointerType !== "mouse" || pinnedTipTarget || mapInteractionKinds.size) return;
      revealStationTooltip(target);
    });
    mark.addEventListener("pointerleave", event => {
      if (event.pointerType !== "mouse" || pinnedTipTarget) return;
      if (visibleTipTarget === target) hideMapTooltip(false);
    });
  }

  const tooltipOutsideBoundary = isStandaloneSite ? document : root;
  tooltipOutsideBoundary.addEventListener("pointerdown", event => {
    if (!pinnedTipTarget) return;
    if (svg.contains(event.target)) return;
    hideMapTooltip();
  }, true);

  svg.addEventListener("wheel", event => {
    event.preventDefault();
    cancelZoomAnimation();
    hideMapTooltip();
    beginMapInteraction("wheel");
    window.clearTimeout(wheelEndTimer);
    wheelEndTimer = window.setTimeout(() => {
      endMapInteraction("wheel");
    }, 180);
    const factor = Math.exp(-event.deltaY * 0.0015);
    applyZoom(zoomState.scale * factor, clientPointInMap(event.clientX, event.clientY));
  }, { passive: false });

  svg.addEventListener("dblclick", event => {
    event.preventDefault();
    animateZoom(
      (zoomAnimationTarget?.scale ?? zoomState.scale) * 1.55,
      clientPointInMap(event.clientX, event.clientY)
    );
  });

  const activePointers = new Map();
  let pointerGesture = null;

  function pointerDistance(first, second) {
    return Math.hypot(second.x - first.x, second.y - first.y);
  }

  function pointerMidpoint(first, second) {
    return [(first.x + second.x) / 2, (first.y + second.y) / 2];
  }

  function rebasePointerGesture() {
    const pointers = [...activePointers.values()];
    if (!pointers.length) {
      pointerGesture = null;
      delete stage.dataset.panning;
      delete stage.dataset.pinching;
      return;
    }
    const inverse = currentMapInverse();
    if (!inverse) return;

    if (pointers.length === 1) {
      const pointer = pointers[0];
      const continuingPan = !pointer.tapEligible;
      pointerGesture = {
        type: "pan",
        ids: [pointer.id],
        inverse,
        startClientX: pointer.x,
        startClientY: pointer.y,
        startX: zoomState.x,
        startY: zoomState.y,
        moved: continuingPan
      };
      if (continuingPan) {
        stage.dataset.panning = "true";
        beginMapInteraction("pointer");
      } else {
        delete stage.dataset.panning;
      }
      delete stage.dataset.pinching;
      return;
    }

    pointers.forEach(pointer => {
      pointer.tapEligible = false;
    });
    const first = pointers[0];
    const second = pointers[1];
    const midpoint = pointerMidpoint(first, second);
    const midpointMap = clientPointInMap(midpoint[0], midpoint[1], inverse);
    pointerGesture = {
      type: "pinch",
      ids: [first.id, second.id],
      inverse,
      startDistance: Math.max(pointerDistance(first, second), 1),
      startScale: zoomState.scale,
      contentAnchor: [
        (midpointMap[0] - zoomState.x) / zoomState.scale,
        (midpointMap[1] - zoomState.y) / zoomState.scale
      ]
    };
    delete stage.dataset.panning;
    stage.dataset.pinching = "true";
    beginMapInteraction("pointer");
    hideMapTooltip();
  }

  function updatePointerGesture() {
    if (!pointerGesture) return;
    if (pointerGesture.type === "pan") {
      const pointer = activePointers.get(pointerGesture.ids[0]);
      if (!pointer) return;
      const clientDx = pointer.x - pointerGesture.startClientX;
      const clientDy = pointer.y - pointerGesture.startClientY;
      if (!pointerGesture.moved) {
        const threshold = pointer.pointerType === "mouse" ? 3 : 8;
        if (Math.hypot(clientDx, clientDy) <= threshold) return;
        pointerGesture.moved = true;
        pointer.tapEligible = false;
        stage.dataset.panning = "true";
        beginMapInteraction("pointer");
        hideMapTooltip();
      }
      const inverse = pointerGesture.inverse;
      const dx = inverse.a * clientDx + inverse.c * clientDy;
      const dy = inverse.b * clientDx + inverse.d * clientDy;
      zoomState.x = pointerGesture.startX + dx;
      zoomState.y = pointerGesture.startY + dy;
      clampZoomPosition();
      scheduleZoomRender();
      return;
    }

    const first = activePointers.get(pointerGesture.ids[0]);
    const second = activePointers.get(pointerGesture.ids[1]);
    if (!first || !second) return;
    const midpoint = pointerMidpoint(first, second);
    const midpointMap = clientPointInMap(midpoint[0], midpoint[1], pointerGesture.inverse);
    zoomState.scale = clamp(
      pointerGesture.startScale
        * pointerDistance(first, second)
        / pointerGesture.startDistance,
      1,
      6
    );
    zoomState.x = midpointMap[0] - pointerGesture.contentAnchor[0] * zoomState.scale;
    zoomState.y = midpointMap[1] - pointerGesture.contentAnchor[1] * zoomState.scale;
    clampZoomPosition();
    scheduleZoomRender();
  }

  svg.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    const mark = event.target.closest?.(stationMarkSelector);
    const fallbackTarget = mark ? stationMarkTargets.get(mark) || null : null;
    const tipCluster = stationClusterAt(
      event.clientX,
      event.clientY,
      event.pointerType,
      fallbackTarget
    );
    const tipTarget = tipCluster?.primary || null;
    cancelZoomAnimation();
    if (!tipTarget) hideMapTooltip();
    activePointers.set(event.pointerId, {
      id: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      pointerType: event.pointerType,
      tapEligible: true,
      tipTarget,
      tipCluster
    });
    try {
      svg.setPointerCapture(event.pointerId);
    } catch {}
    rebasePointerGesture();
    event.preventDefault();
  });

  svg.addEventListener("pointermove", event => {
    if (!activePointers.has(event.pointerId)) return;
    const pointer = activePointers.get(event.pointerId);
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    updatePointerGesture();
    event.preventDefault();
  });

  function finishPointer(event, releaseCapture = true, allowTap = true) {
    if (!activePointers.has(event.pointerId)) return;
    const pointer = activePointers.get(event.pointerId);
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    updatePointerGesture();
    const completedGesture = pointerGesture;
    activePointers.delete(event.pointerId);
    if (releaseCapture && svg.hasPointerCapture(event.pointerId)) {
      try {
        svg.releasePointerCapture(event.pointerId);
      } catch {}
    }
    if (activePointers.size) {
      rebasePointerGesture();
    } else {
      pointerGesture = null;
      delete stage.dataset.panning;
      delete stage.dataset.pinching;
      endMapInteraction("pointer");
      const isStationTap = allowTap
        && pointer.tapEligible
        && completedGesture?.type === "pan"
        && !completedGesture.moved
        && (pointer.pointerType === "mouse"
          || pointer.pointerType === "touch"
          || pointer.pointerType === "pen");
      if (isStationTap) {
        if (pointer.tipTarget) {
          selectStationAt(
            pointer.x,
            pointer.y,
            pointer.pointerType,
            pointer.tipCluster
          );
        }
        else hideMapTooltip();
      }
    }
    event.preventDefault();
  }

  svg.addEventListener("pointerup", event => finishPointer(event));
  svg.addEventListener("pointercancel", event => finishPointer(event, true, false));
  svg.addEventListener("lostpointercapture", event => finishPointer(event, false, false));
  applyZoom(1);

  function pathString(points) {
    return points.map((point, i) => `${i ? "L" : "M"}${point[0].toFixed(2)},${point[1].toFixed(2)}`).join(" ");
  }

  function solve3x3(matrix, vector) {
    const rows = matrix.map((row, index) => [...row, vector[index]]);
    for (let column = 0; column < 3; column += 1) {
      let pivot = column;
      for (let row = column + 1; row < 3; row += 1) {
        if (Math.abs(rows[row][column]) > Math.abs(rows[pivot][column])) pivot = row;
      }
      [rows[column], rows[pivot]] = [rows[pivot], rows[column]];
      const divisor = rows[column][column] || 1e-12;
      for (let index = column; index < 4; index += 1) rows[column][index] /= divisor;
      for (let row = 0; row < 3; row += 1) {
        if (row === column) continue;
        const factor = rows[row][column];
        for (let index = column; index < 4; index += 1) {
          rows[row][index] -= factor * rows[column][index];
        }
      }
    }
    return rows.map(row => row[3]);
  }

  function fitAffine(pairs) {
    const normal = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    const targetX = [0, 0, 0];
    const targetY = [0, 0, 0];
    pairs.forEach(({ from, to }) => {
      const row = [from[0], from[1], 1];
      for (let i = 0; i < 3; i += 1) {
        targetX[i] += row[i] * to[0];
        targetY[i] += row[i] * to[1];
        for (let j = 0; j < 3; j += 1) normal[i][j] += row[i] * row[j];
      }
    });
    return { x: solve3x3(normal, targetX), y: solve3x3(normal, targetY) };
  }

  function applyAffine(point, transform) {
    return [
      transform.x[0] * point[0] + transform.x[1] * point[1] + transform.x[2],
      transform.y[0] * point[0] + transform.y[1] * point[1] + transform.y[2]
    ];
  }

  function officialPoint(point) {
    const transform = officialLayout.mapTransform;
    return [
      transform.a * point[0] + transform.c * point[1] + transform.e,
      transform.b * point[0] + transform.d * point[1] + transform.f
    ];
  }

  function cablebusLineForPath(path) {
    const centerX = (path.bbox[0] + path.bbox[2]) / 2;
    if (centerX < 650) return "3";
    if (centerX > 1500) return "2";
    return "1";
  }

  const officialPaths = officialLayout.paths.map(path => ({
    ...path,
    displayLine: path.system === "cablebus" ? cablebusLineForPath(path) : path.line,
    mappedPoints: path.points.map(officialPoint)
  }));
  const officialPathById = new Map(officialPaths.map(path => [path.id, path]));

  function joinOfficialPaths(parts) {
    const output = [];
    parts.forEach(part => {
      const source = officialPathById.get(part.id);
      if (!source) return;
      let points = source.mappedPoints.map(point => [...point]);
      if (part.reverse) points.reverse();
      if (
        output.length && points.length
        && Math.hypot(output[output.length - 1][0] - points[0][0], output[output.length - 1][1] - points[0][1]) < 0.25
      ) {
        points = points.slice(1);
      }
      output.push(...points);
    });
    return output;
  }

  function geographicPointsForPath(pathData) {
    const points = [];
    pathData.segments.forEach((segment, segmentIndex) => {
      segment.forEach((point, pointIndex) => {
        if (segmentIndex > 0 && pointIndex === 0) return;
        points.push(projection(point));
      });
    });
    return points;
  }

  const directOfficialBindings = new Map([
    ["metrobus-1:0", [{ id: "metrobus-1-15" }]],
    ["metrobus-2:0", [{ id: "metrobus-2-16" }]],
    ["metrobus-3:0", [{ id: "metrobus-3-17", reverse: true }]],
    ["metrobus-5:0", [
      { id: "metrobus-5-22", reverse: true },
      { id: "metrobus-5-23" }
    ]],
    ["metrobus-6:0", [
      { id: "metrobus-6-25" },
      { id: "metrobus-6-26" }
    ]],
    ["metrobus-7:0", [
      { id: "metrobus-7-20" },
      { id: "metrobus-7-18", reverse: true }
    ]],
    ["cablebus-1:0", [{ id: "cablebus-all-31" }]],
    ["cablebus-3:0", [{ id: "cablebus-all-30", reverse: true }]],
    ["suburbano-1:0", [{ id: "suburbano-1-1" }]],
    ["suburbano-1:1", [{ id: "suburbano-aifa-2" }]]
  ]);

  function exactAdditionalSchematic(line, pathIndex) {
    if (line.key === "suburbano-1" && pathIndex === 1) {
      const main = officialPathById.get("suburbano-1-1")?.mappedPoints;
      const branch = officialPathById.get("suburbano-aifa-2")?.mappedPoints;
      if (!main || !branch) return null;
      const junction = polylineIntersection(main, branch) || branch[0];
      const junctionFraction = nearestProjectionOnPolyline(junction, branch).fraction;
      const farFraction = junctionFraction < 0.5 ? 1 : 0;
      return slicePolyline(branch, junctionFraction, farFraction);
    }

    const direct = directOfficialBindings.get(`${line.key}:${pathIndex}`);
    if (direct) return joinOfficialPaths(direct);

    if (line.key === "cablebus-1" && pathIndex === 1) {
      const main = officialPathById.get("cablebus-all-31")?.mappedPoints;
      const branch = officialPathById.get("cablebus-all-32")?.mappedPoints;
      if (!main || !branch) return null;
      const junction = nearestProjectionOnPolyline(branch[0], main).fraction;
      const shared = slicePolyline(main, 0, junction);
      return [...shared, ...branch.slice(1)];
    }

    if (line.key === "cablebus-2") {
      const route = officialPathById.get("cablebus-all-33")?.mappedPoints;
      const joint = mobilityStationById.get("cbb010");
      if (!route || !joint) return null;
      const jointFraction = nearestProjectionOnPolyline(joint.schematic, route).fraction;
      return pathIndex === 0
        ? slicePolyline(route, 0, jointFraction)
        : slicePolyline(route, jointFraction, 1);
    }

    return null;
  }

  function polylineMetrics(points) {
    const cumulative = [0];
    for (let index = 1; index < points.length; index += 1) {
      cumulative.push(cumulative[index - 1] + Math.hypot(
        points[index][0] - points[index - 1][0],
        points[index][1] - points[index - 1][1]
      ));
    }
    return { cumulative, total: cumulative[cumulative.length - 1] || 1 };
  }

  function nearestProjectionOnPolyline(point, points) {
    const metrics = polylineMetrics(points);
    let best = { distance: Infinity, point: points[0] || [0, 0], fraction: 0 };
    for (let index = 1; index < points.length; index += 1) {
      const start = points[index - 1];
      const end = points[index];
      const dx = end[0] - start[0];
      const dy = end[1] - start[1];
      const lengthSquared = dx * dx + dy * dy;
      const local = lengthSquared
        ? clamp(((point[0] - start[0]) * dx + (point[1] - start[1]) * dy) / lengthSquared, 0, 1)
        : 0;
      const projected = [start[0] + dx * local, start[1] + dy * local];
      const distance = Math.hypot(point[0] - projected[0], point[1] - projected[1]);
      if (distance < best.distance) {
        const segmentLength = Math.sqrt(lengthSquared);
        best = {
          distance,
          point: projected,
          fraction: (metrics.cumulative[index - 1] + segmentLength * local) / metrics.total
        };
      }
    }
    return best;
  }

  function nearestProjectionOnPaths(point, paths) {
    return paths.reduce((best, path) => {
      const candidate = nearestProjectionOnPolyline(point, path.mappedPoints);
      return candidate.distance < best.distance ? { ...candidate, path } : best;
    }, { distance: Infinity, point, fraction: 0, path: null });
  }

  function slicePolyline(points, startFraction, endFraction) {
    const reverse = endFraction < startFraction;
    const low = reverse ? endFraction : startFraction;
    const high = reverse ? startFraction : endFraction;
    const metrics = polylineMetrics(points);
    const selected = [pointAlongPolyline(points, low)];
    metrics.cumulative.forEach((distance, index) => {
      const fraction = distance / metrics.total;
      if (fraction > low + 1e-7 && fraction < high - 1e-7) selected.push(points[index]);
    });
    selected.push(pointAlongPolyline(points, high));
    return reverse ? selected.reverse() : selected;
  }

  function pairPolylines(schematicPoints, geoPoints) {
    const fractions = [...fractionsAlong(schematicPoints), ...fractionsAlong(geoPoints)]
      .sort((a, b) => a - b)
      .filter((value, index, values) => index === 0 || Math.abs(value - values[index - 1]) > 1e-6);
    return fractions.map(fraction => ({
      schematic: pointAlongPolyline(schematicPoints, fraction),
      geo: pointAlongPolyline(geoPoints, fraction)
    }));
  }

  const networkGeo = {
    type: "Feature",
    properties: {},
    geometry: {
      type: "MultiLineString",
      coordinates: [
        ...data.lines.flatMap(line => line.segments),
        ...data.additionalLines.flatMap(line =>
          line.paths.flatMap(path => path.segments)
        )
      ]
    }
  };

  function rawMercator(point) {
    const longitude = point[0] * Math.PI / 180;
    const latitude = clamp(point[1], -89.5, 89.5) * Math.PI / 180;
    return [longitude, -Math.log(Math.tan(Math.PI / 4 + latitude / 2))];
  }

  const networkPoints = networkGeo.geometry.coordinates.flat();
  const rawNetworkPoints = networkPoints.map(rawMercator);
  const rawBounds = rawNetworkPoints.reduce((bounds, point) => [
    [Math.min(bounds[0][0], point[0]), Math.min(bounds[0][1], point[1])],
    [Math.max(bounds[1][0], point[0]), Math.max(bounds[1][1], point[1])]
  ], [[Infinity, Infinity], [-Infinity, -Infinity]]);
  const rawWidth = Math.max(rawBounds[1][0] - rawBounds[0][0], 1e-9);
  const rawHeight = Math.max(rawBounds[1][1] - rawBounds[0][1], 1e-9);
  const projectionScale = Math.min(
    (mapBox.right - mapBox.left) / rawWidth,
    (mapBox.bottom - mapBox.top) / rawHeight
  );
  const projectionOffset = [
    mapBox.left + ((mapBox.right - mapBox.left) - rawWidth * projectionScale) / 2 - rawBounds[0][0] * projectionScale,
    mapBox.top + ((mapBox.bottom - mapBox.top) - rawHeight * projectionScale) / 2 - rawBounds[0][1] * projectionScale
  ];

  function projection(point) {
    const raw = rawMercator(point);
    return [
      raw[0] * projectionScale + projectionOffset[0],
      raw[1] * projectionScale + projectionOffset[1]
    ];
  }

  function projectedLinePath(coordinates, closePath = false) {
    if (!coordinates || !coordinates.length) return "";
    const points = coordinates.map(projection);
    return `${pathString(points)}${closePath ? " Z" : ""}`;
  }

  function geoPathMaker(value) {
    if (!value) return "";
    if (value.type === "FeatureCollection") {
      return value.features.map(geoPathMaker).filter(Boolean).join(" ");
    }
    if (value.type === "Feature") return geoPathMaker(value.geometry);
    if (value.type === "GeometryCollection") {
      return value.geometries.map(geoPathMaker).filter(Boolean).join(" ");
    }
    if (value.type === "LineString") return projectedLinePath(value.coordinates);
    if (value.type === "MultiLineString") {
      return value.coordinates.map(line => projectedLinePath(line)).filter(Boolean).join(" ");
    }
    if (value.type === "Polygon") {
      return value.coordinates.map(ring => projectedLinePath(ring, true)).filter(Boolean).join(" ");
    }
    if (value.type === "MultiPolygon") {
      return value.coordinates.flatMap(polygon =>
        polygon.map(ring => projectedLinePath(ring, true))
      ).filter(Boolean).join(" ");
    }
    return "";
  }

  const mobilityOfficialColors = {
    metrobus: {
      "1": "#A8353A", "2": "#8A1A9C", "3": "#799A05", "4": "#FF5200",
      "5": "#001F60", "6": "#E60895", "7": "#006938"
    },
    cablebus: { "1": "#4BC1E1", "2": "#4BC1E1", "3": "#4BC1E1" },
    suburbano: { "1": "#E6392A" }
  };
  data.additionalLines.forEach(line => {
    line.color = mobilityOfficialColors[line.system]?.[line.id] || line.color;
  });

  const stationById = new Map();
  data.stations.forEach(station => {
    station.lines = Array.isArray(station.lines) ? station.lines : [station.lines];
    station.geo = projection([station.lon, station.lat]);
    station.legacySchematic = [
      mapBox.left + station.sx * (mapBox.right - mapBox.left),
      mapBox.top + station.sy * (mapBox.bottom - mapBox.top)
    ];
    const sourcePoint = officialLayout.metroStations[station.id];
    station.schematic = sourcePoint ? officialPoint(sourcePoint) : [...station.legacySchematic];
    station.current = [...station.schematic];
    stationById.set(station.id, station);
  });

  const schematicAlignment = fitAffine(data.stations.map(station => ({
    from: station.legacySchematic,
    to: station.schematic
  })));
  const suburbanoLine = data.additionalLines.find(line => line.system === "suburbano");
  const suburbanoMainIds = new Set(suburbanoLine?.paths[0]?.station_ids || []);
  const suburbanoAifaIds = new Set(suburbanoLine?.paths[1]?.station_ids || []);

  function officialPathsForStation(station) {
    const lineIds = new Set(station.lines.map(String));
    if (station.system === "metrobus") {
      return officialPaths.filter(path =>
        path.system === "metrobus" && lineIds.has(String(path.displayLine))
      );
    }
    if (station.system === "cablebus") {
      return officialPaths.filter(path =>
        path.system === "cablebus" && lineIds.has(String(path.displayLine))
      );
    }
    if (station.system === "suburbano") {
      return officialPaths.filter(path => {
        if (path.system !== "suburbano") return false;
        if (suburbanoMainIds.has(station.id) && suburbanoAifaIds.has(station.id)) return true;
        if (suburbanoAifaIds.has(station.id)) return path.line === "aifa";
        return path.line === "1";
      });
    }
    return [];
  }

  const mobilityStationById = new Map();
  data.additionalStations.forEach(station => {
    station.lines = Array.isArray(station.lines) ? station.lines : [station.lines];
    station.geo = projection([station.lon, station.lat]);
    station.legacySchematic = [
      mapBox.left + station.sx * (mapBox.right - mapBox.left),
      mapBox.top + station.sy * (mapBox.bottom - mapBox.top)
    ];
    const aligned = applyAffine(station.legacySchematic, schematicAlignment);
    station.alignedSchematic = [...aligned];
    const snapped = nearestProjectionOnPaths(aligned, officialPathsForStation(station));
    station.schematic = snapped.path ? snapped.point : aligned;
    station.current = [...station.schematic];
    mobilityStationById.set(station.id, station);
  });

  function stationForId(id) {
    return stationById.get(id) || mobilityStationById.get(id);
  }

  function segmentIntersection(a, b, c, d) {
    const r = [b[0] - a[0], b[1] - a[1]];
    const s = [d[0] - c[0], d[1] - c[1]];
    const cross = r[0] * s[1] - r[1] * s[0];
    if (Math.abs(cross) < 1e-8) return null;
    const offset = [c[0] - a[0], c[1] - a[1]];
    const t = (offset[0] * s[1] - offset[1] * s[0]) / cross;
    const u = (offset[0] * r[1] - offset[1] * r[0]) / cross;
    if (t < -1e-6 || t > 1 + 1e-6 || u < -1e-6 || u > 1 + 1e-6) return null;
    return [a[0] + t * r[0], a[1] + t * r[1]];
  }

  function polylineIntersection(first, second) {
    for (let a = 1; a < first.length; a += 1) {
      for (let b = 1; b < second.length; b += 1) {
        const point = segmentIntersection(first[a - 1], first[a], second[b - 1], second[b]);
        if (point) return point;
      }
    }
    return null;
  }

  const officialSuburbanoMain = officialPaths.find(path => path.system === "suburbano" && path.line === "1");
  const officialSuburbanoAifa = officialPaths.find(path => path.system === "suburbano" && path.line === "aifa");
  const aifaPathData = suburbanoLine?.paths[1];
  if (officialSuburbanoMain && officialSuburbanoAifa && aifaPathData) {
    const junction = polylineIntersection(
      officialSuburbanoMain.mappedPoints,
      officialSuburbanoAifa.mappedPoints
    ) || officialSuburbanoAifa.mappedPoints[0];
    const junctionFraction = nearestProjectionOnPolyline(
      junction,
      officialSuburbanoAifa.mappedPoints
    ).fraction;
    const branchStations = aifaPathData.station_ids.map(stationForId).filter(Boolean);
    const branchFractions = fractionsAlong(branchStations.map(station => station.geo));
    const farFraction = junctionFraction < 0.5 ? 1 : 0;
    branchStations.forEach((station, index) => {
      const fraction = junctionFraction + (farFraction - junctionFraction) * branchFractions[index];
      station.schematic = pointAlongPolyline(officialSuburbanoAifa.mappedPoints, fraction);
      station.current = [...station.schematic];
    });
  }

  const metrobusFive = data.additionalLines.find(line => line.key === "metrobus-5");
  const metrobusFivePath = metrobusFive?.paths[0];
  const metrobusFiveSchematic = joinOfficialPaths([
    { id: "metrobus-5-22", reverse: true },
    { id: "metrobus-5-23" }
  ]);
  if (metrobusFivePath && metrobusFiveSchematic.length > 1) {
    const cumulative = [0];
    metrobusFivePath.segments.forEach(segment => {
      const points = segment.map(projection);
      let length = 0;
      for (let index = 1; index < points.length; index += 1) {
        length += Math.hypot(
          points[index][0] - points[index - 1][0],
          points[index][1] - points[index - 1][1]
        );
      }
      cumulative.push(cumulative[cumulative.length - 1] + length);
    });
    const total = cumulative[cumulative.length - 1] || 1;
    metrobusFivePath.station_ids.forEach((stationId, index) => {
      const station = stationForId(stationId);
      if (!station) return;
      station.schematic = pointAlongPolyline(metrobusFiveSchematic, cumulative[index] / total);
      station.current = [...station.schematic];
    });
  }

  function orientGuideToStationOrder(points, stationIds) {
    const first = stationForId(stationIds[0]);
    const last = stationForId(stationIds[stationIds.length - 1]);
    if (!first || !last || points.length < 2) return points.map(point => [...point]);
    const start = points[0];
    const end = points[points.length - 1];
    const direct = Math.hypot(first.schematic[0] - start[0], first.schematic[1] - start[1])
      + Math.hypot(last.schematic[0] - end[0], last.schematic[1] - end[1]);
    const reverse = Math.hypot(first.schematic[0] - end[0], first.schematic[1] - end[1])
      + Math.hypot(last.schematic[0] - start[0], last.schematic[1] - start[1]);
    return (reverse < direct ? [...points].reverse() : points).map(point => [...point]);
  }

  function warpPolylineEndpoints(points, from, to) {
    if (!points || points.length < 2) return [[...from], [...to]];
    const start = points[0];
    const end = points[points.length - 1];
    const sourceX = end[0] - start[0];
    const sourceY = end[1] - start[1];
    const sourceSquared = sourceX * sourceX + sourceY * sourceY;
    if (sourceSquared < 1e-8) return [[...from], [...to]];
    const targetX = to[0] - from[0];
    const targetY = to[1] - from[1];
    const real = (targetX * sourceX + targetY * sourceY) / sourceSquared;
    const imaginary = (targetY * sourceX - targetX * sourceY) / sourceSquared;
    return points.map(point => {
      const localX = point[0] - start[0];
      const localY = point[1] - start[1];
      return [
        from[0] + real * localX - imaginary * localY,
        from[1] + imaginary * localX + real * localY
      ];
    });
  }

  function buildUniformSchematicLayout() {
    const proposals = new Map();
    const constraints = [];

    function addProposal(stationId, point) {
      if (!proposals.has(stationId)) proposals.set(stationId, []);
      proposals.get(stationId).push(point);
    }

    function registerRoute(routeKey, stationIds, sourceGuide, fixedStep = null) {
      if (!sourceGuide || sourceGuide.length < 2 || stationIds.length < 2) return null;
      const guide = orientGuideToStationOrder(sourceGuide, stationIds);
      const fractions = stationIds.map((_, index) => index / (stationIds.length - 1));
      const guideLength = polylineMetrics(guide).total;
      const step = fixedStep || guideLength / (stationIds.length - 1);

      stationIds.forEach((stationId, index) => {
        addProposal(stationId, pointAlongPolyline(guide, fractions[index]));
        if (index === 0) return;
        constraints.push({
          from: stationIds[index - 1],
          to: stationId,
          routeKey,
          target: step
        });
      });
      return { guide, fractions, step };
    }

    data.lines.forEach(line => {
      const officialGuide = officialPaths.find(path =>
        path.system === "metro" && path.line === line.id
      )?.mappedPoints;
      const registered = registerRoute(`metro-${line.id}`, line.station_ids, officialGuide);
      if (!registered) return;
      line.schematicGuide = registered.guide;
      line.schematicFractions = registered.fractions;
      line.schematicStep = registered.step;
    });

    data.additionalLines.forEach(line => {
      line.paths.forEach((pathData, pathIndex) => {
        const officialGuide = exactAdditionalSchematic(line, pathIndex);
        const fallbackGuide = pathData.station_ids.map(stationId => {
          const station = stationForId(stationId);
          return station?.alignedSchematic || station?.schematic || [0, 0];
        });
        const registered = registerRoute(
          `${line.key}:${pathIndex}`,
          pathData.station_ids,
          officialGuide || fallbackGuide,
          line.key === "metrobus-4" ? 13.5 : null
        );
        if (!registered) return;
        pathData.schematicGuide = registered.guide;
        pathData.schematicFractions = registered.fractions;
        pathData.schematicStep = registered.step;
        pathData.usesOfficialGuide = Boolean(officialGuide);
      });
    });

    const initial = new Map();
    [...stationById, ...mobilityStationById].forEach(([stationId, station]) => {
      const stationProposals = proposals.get(stationId) || [station.schematic];
      initial.set(stationId, [
        stationProposals.reduce((sum, point) => sum + point[0], 0) / stationProposals.length,
        stationProposals.reduce((sum, point) => sum + point[1], 0) / stationProposals.length
      ]);
    });

    const positions = new Map(
      [...initial].map(([stationId, point]) => [stationId, [...point]])
    );
    const iterations = 5000;
    const anchorStrength = 0.00001;
    for (let iteration = 0; iteration < iterations; iteration += 1) {
      const relaxation = 0.44 * (1 - iteration / 6200);
      constraints.forEach(constraint => {
        const from = positions.get(constraint.from);
        const to = positions.get(constraint.to);
        if (!from || !to) return;
        let dx = to[0] - from[0];
        let dy = to[1] - from[1];
        const distance = Math.hypot(dx, dy) || 1;
        const correction = (distance - constraint.target) * relaxation * 0.5;
        dx /= distance;
        dy /= distance;
        from[0] += dx * correction;
        from[1] += dy * correction;
        to[0] -= dx * correction;
        to[1] -= dy * correction;
      });
      positions.forEach((point, stationId) => {
        const anchor = initial.get(stationId);
        point[0] += (anchor[0] - point[0]) * anchorStrength;
        point[1] += (anchor[1] - point[1]) * anchorStrength;
      });
    }

    [...stationById, ...mobilityStationById].forEach(([stationId, station]) => {
      const point = positions.get(stationId);
      if (!point) return;
      station.schematic = [...point];
      station.current = [...point];
    });
  }

  buildUniformSchematicLayout();

  const gridLayer = root.querySelector('[data-layer="schematic-grid"]');
  gridLayer.setAttribute("opacity", "0");

  const administrativeBoundaryStyle = {
    fill: "#0a0e13",
    "fill-opacity": "0.45",
    stroke: "#46505b",
    "stroke-opacity": "0.72",
    "stroke-width": "1.1",
    "vector-effect": "non-scaling-stroke"
  };

  const boroughLayer = root.querySelector('[data-layer="boroughs"]');
  const boroughPath = svgNode("path", {
    class: "metro-administrative-boundary",
    d: geoPathMaker(data.boroughs) || "",
    ...administrativeBoundaryStyle
  });
  boroughLayer.appendChild(boroughPath);

  const edomexLayer = root.querySelector('[data-layer="edomex"]');
  const edomexPath = svgNode("path", {
    class: "metro-administrative-boundary",
    d: geoPathMaker(data.edomex) || "",
    ...administrativeBoundaryStyle
  });
  edomexLayer.appendChild(edomexPath);

  const edomexLabelsLayer = root.querySelector('[data-layer="edomex-labels"]');
  data.edomex.features.forEach(feature => {
    const properties = feature.properties;
    const point = projection([properties.label_lon, properties.label_lat]);
    const label = svgNode("text", {
      class: "metro-municipality-label",
      x: point[0].toFixed(2),
      y: point[1].toFixed(2),
      fill: "#8d99a5",
      stroke: "#05070a",
      "stroke-width": "3.6",
      "stroke-linejoin": "round",
      "font-size": "10"
    });
    label.textContent = properties.name;
    edomexLabelsLayer.appendChild(label);
  });

  const roadsLayer = root.querySelector('[data-layer="roads"]');
  const roadsPath = svgNode("path", {
    class: "metro-road",
    d: geoPathMaker(data.roads) || "",
    fill: "none",
    stroke: "#27303a",
    "stroke-opacity": "0.64",
    "stroke-width": "0.72",
    "vector-effect": "non-scaling-stroke"
  });
  roadsLayer.appendChild(roadsPath);
  boroughLayer.setAttribute("opacity", "0");
  edomexLayer.setAttribute("opacity", "0");
  edomexLabelsLayer.setAttribute("opacity", "0");
  roadsLayer.setAttribute("opacity", "0");

  const officialSchematicHalosLayer = root.querySelector('[data-layer="official-schematic-halos"]');
  const officialSchematicLinesLayer = root.querySelector('[data-layer="official-schematic-lines"]');
  const officialScale = Math.hypot(officialLayout.mapTransform.a, officialLayout.mapTransform.b);
  officialPaths.filter(path => path.system !== "metro").forEach(path => {
    const width = Math.max(1.9, path.strokeWidth * officialScale);
    const d = pathString(path.mappedPoints);
    officialSchematicHalosLayer.appendChild(svgNode("path", {
      class: "official-schematic-halo",
      d,
      stroke: "#05070a",
      "stroke-width": (width + 3.8).toFixed(2)
    }));
    const visible = svgNode("path", {
      class: "official-schematic-line",
      d,
      stroke: path.stroke,
      "stroke-width": width.toFixed(2),
      filter: "url(#metro-soft-glow)",
      "data-system": path.system,
      "data-line": path.displayLine
    });
    if (path.strokeDasharray) {
      const dash = String(path.strokeDasharray)
        .trim()
        .split(/[ ,]+/)
        .map(value => Number(value) * officialScale)
        .filter(Number.isFinite)
        .map(value => value.toFixed(2))
        .join(" ");
      if (dash) visible.setAttribute("stroke-dasharray", dash);
    }
    officialSchematicLinesLayer.appendChild(visible);
  });

  function fractionsAlong(points) {
    const cumulative = [0];
    for (let i = 1; i < points.length; i += 1) {
      cumulative.push(cumulative[i - 1] + Math.hypot(
        points[i][0] - points[i - 1][0],
        points[i][1] - points[i - 1][1]
      ));
    }
    const total = cumulative[cumulative.length - 1] || 1;
    return cumulative.map(value => value / total);
  }

  function pointAlongPolyline(points, fraction) {
    if (points.length < 2) return points[0] || [0, 0];
    const lengths = [0];
    for (let i = 1; i < points.length; i += 1) {
      lengths.push(lengths[i - 1] + Math.hypot(
        points[i][0] - points[i - 1][0],
        points[i][1] - points[i - 1][1]
      ));
    }
    const total = lengths[lengths.length - 1] || 1;
    const target = clamp(fraction, 0, 1) * total;
    let index = 1;
    while (index < lengths.length - 1 && lengths[index] < target) index += 1;
    const segmentLength = lengths[index] - lengths[index - 1] || 1;
    const local = (target - lengths[index - 1]) / segmentLength;
    return [
      points[index - 1][0] + (points[index][0] - points[index - 1][0]) * local,
      points[index - 1][1] + (points[index][1] - points[index - 1][1]) * local
    ];
  }

  function octolinearConnection(from, to) {
    const dx = to[0] - from[0];
    const dy = to[1] - from[1];
    const ax = Math.abs(dx);
    const ay = Math.abs(dy);
    const dominant = Math.max(ax, ay) || 1;
    if (Math.min(ax, ay) / dominant < 0.08 || Math.abs(ax - ay) / dominant < 0.08) {
      return [from, to];
    }
    const sx = Math.sign(dx) || 1;
    const sy = Math.sign(dy) || 1;
    if (ax > ay) {
      return [from, [from[0] + sx * ay, to[1]], to];
    }
    return [from, [to[0], from[1] + sy * ax], to];
  }

  const mobilityHalosLayer = root.querySelector('[data-layer="mobility-halos"]');
  const mobilityLinesLayer = root.querySelector('[data-layer="mobility-lines"]');
  const mobilityRouteRenderers = [];

  data.additionalLines.forEach(line => {
    const style = line.system === "suburbano"
      ? { width: 4.3, halo: 8.4, dash: null }
      : line.system === "cablebus"
        ? { width: 3.0, halo: 6.5, dash: null }
        : { width: 3.15, halo: 6.6, dash: null };
    const parts = line.paths.map((pathData, pathIndex) => {
      const pairedSegments = pathData.segments.map((segment, segmentIndex) => {
          const from = stationForId(pathData.station_ids[segmentIndex]);
          const to = stationForId(pathData.station_ids[segmentIndex + 1]);
          const geoPoints = warpPolylineEndpoints(
            segment.map(point => projection(point)),
            from.geo,
            to.geo
          );
          const startFraction = pathData.schematicFractions?.[segmentIndex];
          const endFraction = pathData.schematicFractions?.[segmentIndex + 1];
          const sourceGuide = pathData.usesOfficialGuide && pathData.schematicGuide
            && Number.isFinite(startFraction)
            && Number.isFinite(endFraction)
            ? slicePolyline(pathData.schematicGuide, startFraction, endFraction)
            : [from.schematic, to.schematic];
          const schematicGuide = warpPolylineEndpoints(
            sourceGuide,
            from.schematic,
            to.schematic
          );
          return pairPolylines(schematicGuide, geoPoints);
        });

      const halo = svgNode("path", {
        class: "mobility-halo",
        stroke: "#05070a",
        "stroke-width": style.halo
      });
      const visible = svgNode("path", {
        class: "mobility-line",
        stroke: line.system === "suburbano" && pathIndex === 1
          ? (officialSuburbanoAifa?.stroke || "#F7B9A3")
          : line.color,
        "stroke-width": style.width,
        filter: "url(#metro-soft-glow)"
      });
      if (line.system === "suburbano" && pathIndex === 1) {
        visible.setAttribute("stroke-dasharray", "6 3");
      }
      if (style.dash) visible.setAttribute("stroke-dasharray", style.dash);
      mobilityHalosLayer.appendChild(halo);
      mobilityLinesLayer.appendChild(visible);
      visible.setAttribute("data-route", `${line.key}:${pathIndex}`);
      return { pathData, pairedSegments, halo, visible };
    });
    mobilityRouteRenderers.push({ line, parts });
  });

  const halosLayer = root.querySelector('[data-layer="halos"]');
  const linesLayer = root.querySelector('[data-layer="lines"]');
  const lineRenderers = [];

  data.lines.forEach(line => {
    const pairedSegments = line.segments.map((segment, segmentIndex) => {
      const from = stationById.get(line.station_ids[segmentIndex]);
      const to = stationById.get(line.station_ids[segmentIndex + 1]);
      const geoPoints = warpPolylineEndpoints(
        segment.map(point => projection(point)),
        from.geo,
        to.geo
      );
      const startFraction = line.schematicFractions?.[segmentIndex];
      const endFraction = line.schematicFractions?.[segmentIndex + 1];
      const sourceGuide = line.schematicGuide && Number.isFinite(startFraction)
        && Number.isFinite(endFraction)
        ? slicePolyline(line.schematicGuide, startFraction, endFraction)
        : [from.schematic, to.schematic];
      const schematicPoints = warpPolylineEndpoints(
        sourceGuide,
        from.schematic,
        to.schematic
      );
      return pairPolylines(schematicPoints, geoPoints);
    });

    const halo = svgNode("path", {
      class: "metro-halo",
      stroke: "#05070a",
      "stroke-width": line.id === "B" ? 12 : 11
    });
    halosLayer.appendChild(halo);

    const paths = [];
    if (line.id === "B") {
      const outer = svgNode("path", {
        class: "metro-b-line",
        stroke: "#afafad",
        "stroke-width": 7.2,
        filter: "url(#metro-soft-glow)"
      });
      const inner = svgNode("path", {
        class: "metro-b-line",
        stroke: officialColors.B,
        "stroke-width": 3.2
      });
      linesLayer.appendChild(outer);
      linesLayer.appendChild(inner);
      paths.push(outer, inner);
    } else {
      const path = svgNode("path", {
        class: "metro-line",
        stroke: officialColors[line.id] || line.color,
        "stroke-width": 6.4,
        filter: "url(#metro-soft-glow)"
      });
      linesLayer.appendChild(path);
      paths.push(path);
    }
    paths.forEach(path => path.setAttribute("data-route", `metro-${line.id}`));
    lineRenderers.push({ line, pairedSegments, halo, paths });
  });

  const systemNames = {
    metrobus: "Metrobús",
    cablebus: "Cablebús",
    suburbano: "Tren Suburbano"
  };
  const suburbanoRoute = data.additionalLines.find(line => line.system === "suburbano");
  const aifaStationIds = new Set(
    suburbanoRoute && suburbanoRoute.paths[1]
      ? suburbanoRoute.paths[1].station_ids.slice(1)
      : []
  );

  function mobilityPresentation(station) {
    if (station.system === "suburbano" && aifaStationIds.has(station.id)) {
      return { icon: "felipeAngeles", name: "Tren Felipe Ángeles" };
    }
    return {
      icon: station.system,
      name: systemNames[station.system] || station.system
    };
  }

  function stationTooltipIcon(station, fallbackIconKey) {
    const crop = stationIconAtlasMeta.icons[station.id];
    if (crop) {
      const icon = svgNode("svg", {
        class: "metro-tip-icon",
        viewBox: `${crop.x} ${crop.y} ${crop.size} ${crop.size}`,
        preserveAspectRatio: "xMidYMid meet",
        "aria-hidden": "true",
        focusable: "false"
      });
      icon.appendChild(svgNode("image", {
        href: stationIconAtlas,
        x: 0,
        y: 0,
        width: stationIconAtlasMeta.width,
        height: stationIconAtlasMeta.height,
        preserveAspectRatio: "none"
      }));
      return icon;
    }

    const icon = document.createElement("img");
    icon.className = "metro-tip-icon";
    icon.src = networkIcons[fallbackIconKey] || networkIcons.metro;
    icon.alt = "";
    icon.setAttribute("aria-hidden", "true");
    return icon;
  }

  function showTooltip(copy, station, fallbackIconKey) {
    const row = document.createElement("span");
    row.className = "metro-tip-row";
    const text = document.createElement("span");
    text.className = "metro-tip-copy";
    const label = document.createElement("span");
