    position: relative;
    width: 100%;
    overflow: hidden;
    background: #05070a;
  }

    width: 100%;
    height: auto;
    overflow: hidden;
    touch-action: none;

    cursor: grabbing;
  }

    color: #f7f9fb;
    background: rgba(30, 34, 39, 0.97);

    border-radius: 0.55rem;

    font-size: 0.84rem;
  }

  #metro-cdmx-morph .metro-tip.is-visible {
    visibility: visible;
  }

  #metro-cdmx-morph .metro-tip-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-inline-size: 0;

  #metro-cdmx-morph .metro-tip-row > span:last-child {
    min-inline-size: 0;
    overflow-wrap: anywhere;
  }

    display: block;
    width: 1.65rem;
    height: 1.65rem;
    flex: 0 0 auto;
    object-fit: contain;
  }

  #metro-cdmx-morph .metro-control {
    width: min(100%, 520px);
    flex: 1 1 300px;
    accent-color: #f4f7fa;
  }

  #metro-cdmx-morph .metro-mode {
    min-width: 11rem;
    font-variant-numeric: tabular-nums;
  }

  #metro-cdmx-morph .metro-detail {
    min-height: 1.5em;
  }

    display: flex;
    align-items: center;
    gap: 0.7rem 1rem;
    flex-wrap: wrap;
    padding: 0.7rem 0 0;

  #metro-cdmx-morph .viz-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;

    display: inline-grid;
    min-width: 2.35rem;
    height: 2.35rem;

    color: #f4f7fa;

    border: 0;

      .sort((a, b) => a - b)
      .filter((value, index, values) => index === 0 || Math.abs(value - values[index - 1]) > 1e-6);
    return fractions.map(fraction => ({
      schematic: pointAlongPolyline(schematicPoints, fraction),
      geo: pointAlongPolyline(geoPoints, fraction)
    }));
  }

  const networkGeo = {
    type: "Feature",
    properties: {},
    geometry: {
      type: "MultiLineString",
      coordinates: [
        ...data.lines.flatMap(line => line.segments),
        ...data.additionalLines.flatMap(line =>
          line.paths.flatMap(path => path.segments)
        )
      ]
    }
  };

  function rawMercator(point) {
    const longitude = point[0] * Math.PI / 180;
    const latitude = clamp(point[1], -89.5, 89.5) * Math.PI / 180;
    return [longitude, -Math.log(Math.tan(Math.PI / 4 + latitude / 2))];
  }

  const networkPoints = networkGeo.geometry.coordinates.flat();
  const rawNetworkPoints = networkPoints.map(rawMercator);
  const rawBounds = rawNetworkPoints.reduce((bounds, point) => [
    [Math.min(bounds[0][0], point[0]), Math.min(bounds[0][1], point[1])],
    [Math.max(bounds[1][0], point[0]), Math.max(bounds[1][1], point[1])]
  ], [[Infinity, Infinity], [-Infinity, -Infinity]]);
  const rawWidth = Math.max(rawBounds[1][0] - rawBounds[0][0], 1e-9);
  const rawHeight = Math.max(rawBounds[1][1] - rawBounds[0][1], 1e-9);
  const projectionScale = Math.min(
    (mapBox.right - mapBox.left) / rawWidth,
    (mapBox.bottom - mapBox.top) / rawHeight
  );
  const projectionOffset = [
    mapBox.left + ((mapBox.right - mapBox.left) - rawWidth * projectionScale) / 2 - rawBounds[0][0] * projectionScale,
    mapBox.top + ((mapBox.bottom - mapBox.top) - rawHeight * projectionScale) / 2 - rawBounds[0][1] * projectionScale
  ];

  function projection(point) {
    const raw = rawMercator(point);
    return [
      raw[0] * projectionScale + projectionOffset[0],
      raw[1] * projectionScale + projectionOffset[1]
    ];
  }

  function projectedLinePath(coordinates, closePath = false) {
    if (!coordinates || !coordinates.length) return "";
    const points = coordinates.map(projection);
    return `${pathString(points)}${closePath ? " Z" : ""}`;
  }

  function geoPathMaker(value) {
    if (!value) return "";
    if (value.type === "FeatureCollection") {
      return value.features.map(geoPathMaker).filter(Boolean).join(" ");
    }
    if (value.type === "Feature") return geoPathMaker(value.geometry);
    if (value.type === "GeometryCollection") {
      return value.geometries.map(geoPathMaker).filter(Boolean).join(" ");
    }
    if (value.type === "LineString") return projectedLinePath(value.coordinates);
    if (value.type === "MultiLineString") {
      return value.coordinates.map(line => projectedLinePath(line)).filter(Boolean).join(" ");
    }
    if (value.type === "Polygon") {
      return value.coordinates.map(ring => projectedLinePath(ring, true)).filter(Boolean).join(" ");
    }
    if (value.type === "MultiPolygon") {
      return value.coordinates.flatMap(polygon =>
        polygon.map(ring => projectedLinePath(ring, true))
      ).filter(Boolean).join(" ");
    }
    return "";
  }

  const mobilityOfficialColors = {
    metrobus: {
      "1": "#A8353A", "2": "#8A1A9C", "3": "#799A05", "4": "#FF5200",
      "5": "#001F60", "6": "#E60895", "7": "#006938"
    },
    cablebus: { "1": "#4BC1E1", "2": "#4BC1E1", "3": "#4BC1E1" },
    suburbano: { "1": "#E6392A" }
  };
  data.additionalLines.forEach(line => {
    line.color = mobilityOfficialColors[line.system]?.[line.id] || line.color;
  });

  const stationById = new Map();
  data.stations.forEach(station => {
    station.lines = Array.isArray(station.lines) ? station.lines : [station.lines];
    station.geo = projection([station.lon, station.lat]);
    station.legacySchematic = [
      mapBox.left + station.sx * (mapBox.right - mapBox.left),
      mapBox.top + station.sy * (mapBox.bottom - mapBox.top)
    ];
    const sourcePoint = officialLayout.metroStations[station.id];
    station.schematic = sourcePoint ? officialPoint(sourcePoint) : [...station.legacySchematic];
    station.current = [...station.schematic];
    stationById.set(station.id, station);
  });

  const schematicAlignment = fitAffine(data.stations.map(station => ({
    from: station.legacySchematic,
    to: station.schematic
  })));
  const suburbanoLine = data.additionalLines.find(line => line.system === "suburbano");
  const suburbanoMainIds = new Set(suburbanoLine?.paths[0]?.station_ids || []);
  const suburbanoAifaIds = new Set(suburbanoLine?.paths[1]?.station_ids || []);

  function officialPathsForStation(station) {
    const lineIds = new Set(station.lines.map(String));
    if (station.system === "metrobus") {
      return officialPaths.filter(path =>
        path.system === "metrobus" && lineIds.has(String(path.displayLine))
      );
    }
    if (station.system === "cablebus") {
      return officialPaths.filter(path =>
        path.system === "cablebus" && lineIds.has(String(path.displayLine))
      );
    }
    if (station.system === "suburbano") {
      return officialPaths.filter(path => {
        if (path.system !== "suburbano") return false;
        if (suburbanoMainIds.has(station.id) && suburbanoAifaIds.has(station.id)) return true;
        if (suburbanoAifaIds.has(station.id)) return path.line === "aifa";
        return path.line === "1";
      });
    }
    return [];
  }

  const mobilityStationById = new Map();
  data.additionalStations.forEach(station => {
    station.lines = Array.isArray(station.lines) ? station.lines : [station.lines];
    station.geo = projection([station.lon, station.lat]);
    station.legacySchematic = [
      mapBox.left + station.sx * (mapBox.right - mapBox.left),
      mapBox.top + station.sy * (mapBox.bottom - mapBox.top)
    ];
    const aligned = applyAffine(station.legacySchematic, schematicAlignment);
    const snapped = nearestProjectionOnPaths(aligned, officialPathsForStation(station));
    station.schematic = snapped.path ? snapped.point : aligned;
    station.current = [...station.schematic];
    mobilityStationById.set(station.id, station);
  });

  function stationForId(id) {
    return stationById.get(id) || mobilityStationById.get(id);
  }

  function segmentIntersection(a, b, c, d) {
    const r = [b[0] - a[0], b[1] - a[1]];
    const s = [d[0] - c[0], d[1] - c[1]];
    const cross = r[0] * s[1] - r[1] * s[0];
    if (Math.abs(cross) < 1e-8) return null;
    const offset = [c[0] - a[0], c[1] - a[1]];
    const t = (offset[0] * s[1] - offset[1] * s[0]) / cross;
    const u = (offset[0] * r[1] - offset[1] * r[0]) / cross;
    if (t < -1e-6 || t > 1 + 1e-6 || u < -1e-6 || u > 1 + 1e-6) return null;
    return [a[0] + t * r[0], a[1] + t * r[1]];
  }

  function polylineIntersection(first, second) {
    for (let a = 1; a < first.length; a += 1) {
      for (let b = 1; b < second.length; b += 1) {
        const point = segmentIntersection(first[a - 1], first[a], second[b - 1], second[b]);
        if (point) return point;
      }
    }
    return null;
  }

  const officialSuburbanoMain = officialPaths.find(path => path.system === "suburbano" && path.line === "1");
  const officialSuburbanoAifa = officialPaths.find(path => path.system === "suburbano" && path.line === "aifa");
  const aifaPathData = suburbanoLine?.paths[1];
  if (officialSuburbanoMain && officialSuburbanoAifa && aifaPathData) {
    const junction = polylineIntersection(
      officialSuburbanoMain.mappedPoints,
      officialSuburbanoAifa.mappedPoints
    ) || officialSuburbanoAifa.mappedPoints[0];
    const junctionFraction = nearestProjectionOnPolyline(
      junction,
      officialSuburbanoAifa.mappedPoints
    ).fraction;
    const branchStations = aifaPathData.station_ids.map(stationForId).filter(Boolean);
    const branchFractions = fractionsAlong(branchStations.map(station => station.geo));
    const farFraction = junctionFraction < 0.5 ? 1 : 0;
    branchStations.forEach((station, index) => {
      const fraction = junctionFraction + (farFraction - junctionFraction) * branchFractions[index];
      station.schematic = pointAlongPolyline(officialSuburbanoAifa.mappedPoints, fraction);
      station.current = [...station.schematic];
    });
  }

  const metrobusFive = data.additionalLines.find(line => line.key === "metrobus-5");
  const metrobusFivePath = metrobusFive?.paths[0];
  const metrobusFiveSchematic = joinOfficialPaths([
    { id: "metrobus-5-22", reverse: true },
    { id: "metrobus-5-23" }
  ]);
  if (metrobusFivePath && metrobusFiveSchematic.length > 1) {
    const cumulative = [0];
    metrobusFivePath.segments.forEach(segment => {
      const points = segment.map(projection);
      let length = 0;
      for (let index = 1; index < points.length; index += 1) {
        length += Math.hypot(
          points[index][0] - points[index - 1][0],
          points[index][1] - points[index - 1][1]
        );
      }
      cumulative.push(cumulative[cumulative.length - 1] + length);
    });
    const total = cumulative[cumulative.length - 1] || 1;
    metrobusFivePath.station_ids.forEach((stationId, index) => {
      const station = stationForId(stationId);
      if (!station) return;
      station.schematic = pointAlongPolyline(metrobusFiveSchematic, cumulative[index] / total);
      station.current = [...station.schematic];
    });
  }

  const gridLayer = root.querySelector('[data-layer="schematic-grid"]');
  gridLayer.setAttribute("opacity", "0");

  const administrativeBoundaryStyle = {
    fill: "#0a0e13",
    "fill-opacity": "0.45",
    stroke: "#46505b",
    "stroke-opacity": "0.72",
    "stroke-width": "1.1",
    "vector-effect": "non-scaling-stroke"
  };

  const boroughLayer = root.querySelector('[data-layer="boroughs"]');
  const boroughPath = svgNode("path", {
    d: geoPathMaker(data.boroughs) || "",
    ...administrativeBoundaryStyle
  });
  boroughLayer.appendChild(boroughPath);

  const edomexLayer = root.querySelector('[data-layer="edomex"]');
  const edomexPath = svgNode("path", {
    d: geoPathMaker(data.edomex) || "",
    ...administrativeBoundaryStyle
  });
  edomexLayer.appendChild(edomexPath);

  const edomexLabelsLayer = root.querySelector('[data-layer="edomex-labels"]');
  data.edomex.features.forEach(feature => {
    const properties = feature.properties;
    const point = projection([properties.label_lon, properties.label_lat]);
    const label = svgNode("text", {
      class: "metro-municipality-label",
      x: point[0].toFixed(2),
      y: point[1].toFixed(2),
      fill: "#8d99a5",
      stroke: "#05070a",
      "stroke-width": "3.6",
      "stroke-linejoin": "round",
      "font-size": "10"
    });
    label.textContent = properties.name;
    edomexLabelsLayer.appendChild(label);
  });

  const roadsLayer = root.querySelector('[data-layer="roads"]');
  const roadsPath = svgNode("path", {
    d: geoPathMaker(data.roads) || "",
    fill: "none",
    stroke: "#27303a",
    "stroke-opacity": "0.64",
    "stroke-width": "0.72",
    "vector-effect": "non-scaling-stroke"
  });
  roadsLayer.appendChild(roadsPath);
  boroughLayer.setAttribute("opacity", "0");
  edomexLayer.setAttribute("opacity", "0");
  edomexLabelsLayer.setAttribute("opacity", "0");
  roadsLayer.setAttribute("opacity", "0");

  const officialSchematicHalosLayer = root.querySelector('[data-layer="official-schematic-halos"]');
  const officialSchematicLinesLayer = root.querySelector('[data-layer="official-schematic-lines"]');
  const officialScale = Math.hypot(officialLayout.mapTransform.a, officialLayout.mapTransform.b);
  officialPaths.filter(path => path.system !== "metro").forEach(path => {
    const width = Math.max(1.9, path.strokeWidth * officialScale);
    const d = pathString(path.mappedPoints);
    officialSchematicHalosLayer.appendChild(svgNode("path", {
      class: "official-schematic-halo",
      d,
      stroke: "#05070a",
      "stroke-width": (width + 3.8).toFixed(2)
    }));
    const visible = svgNode("path", {
      class: "official-schematic-line",
      d,
      stroke: path.stroke,
      "stroke-width": width.toFixed(2),
      filter: "url(#metro-soft-glow)",
      "data-system": path.system,
      "data-line": path.displayLine
    });
    if (path.strokeDasharray) {
      const dash = String(path.strokeDasharray)
        .trim()
        .split(/[ ,]+/)
        .map(value => Number(value) * officialScale)
        .filter(Number.isFinite)
        .map(value => value.toFixed(2))
        .join(" ");
      if (dash) visible.setAttribute("stroke-dasharray", dash);
    }
    officialSchematicLinesLayer.appendChild(visible);
  });

  function fractionsAlong(points) {
    const cumulative = [0];
    for (let i = 1; i < points.length; i += 1) {
      cumulative.push(cumulative[i - 1] + Math.hypot(
        points[i][0] - points[i - 1][0],
        points[i][1] - points[i - 1][1]
      ));
    }
    const total = cumulative[cumulative.length - 1] || 1;
    return cumulative.map(value => value / total);
  }

  function pointAlongPolyline(points, fraction) {
    if (points.length < 2) return points[0] || [0, 0];
    const lengths = [0];
    for (let i = 1; i < points.length; i += 1) {
      lengths.push(lengths[i - 1] + Math.hypot(
        points[i][0] - points[i - 1][0],
        points[i][1] - points[i - 1][1]
      ));
    }
    const total = lengths[lengths.length - 1] || 1;
    const target = clamp(fraction, 0, 1) * total;
    let index = 1;
    while (index < lengths.length - 1 && lengths[index] < target) index += 1;
    const segmentLength = lengths[index] - lengths[index - 1] || 1;
    const local = (target - lengths[index - 1]) / segmentLength;
    return [
      points[index - 1][0] + (points[index][0] - points[index - 1][0]) * local,
      points[index - 1][1] + (points[index][1] - points[index - 1][1]) * local
    ];
  }

  function octolinearConnection(from, to) {
    const dx = to[0] - from[0];
    const dy = to[1] - from[1];
    const ax = Math.abs(dx);
    const ay = Math.abs(dy);
    const dominant = Math.max(ax, ay) || 1;
    if (Math.min(ax, ay) / dominant < 0.08 || Math.abs(ax - ay) / dominant < 0.08) {
      return [from, to];
    }
    const sx = Math.sign(dx) || 1;
    const sy = Math.sign(dy) || 1;
    if (ax > ay) {
      return [from, [from[0] + sx * ay, to[1]], to];
    }
    return [from, [to[0], from[1] + sy * ax], to];
  }

  const mobilityHalosLayer = root.querySelector('[data-layer="mobility-halos"]');
  const mobilityLinesLayer = root.querySelector('[data-layer="mobility-lines"]');
  const mobilityRouteRenderers = [];

  data.additionalLines.forEach(line => {
    const style = line.system === "suburbano"
      ? { width: 4.3, halo: 8.4, dash: null }
      : line.system === "cablebus"
        ? { width: 3.0, halo: 6.5, dash: null }
        : { width: 3.15, halo: 6.6, dash: null };
    const parts = line.paths.map((pathData, pathIndex) => {
      const exactSchematic = exactAdditionalSchematic(line, pathIndex);
      const pairedPolyline = exactSchematic && exactSchematic.length > 1
        ? pairPolylines(exactSchematic, geographicPointsForPath(pathData))
        : null;
      const pairedSegments = pairedPolyline ? [] : pathData.segments.map((segment, segmentIndex) => {
          const from = stationForId(pathData.station_ids[segmentIndex]);
          const to = stationForId(pathData.station_ids[segmentIndex + 1]);
          const geoPoints = segment.map(point => projection(point));
          const fractions = fractionsAlong(geoPoints);
          const schematicGuide = octolinearConnection(from.schematic, to.schematic);
          return geoPoints.map((geoPoint, pointIndex) => ({
            geo: geoPoint,
            schematic: pointAlongPolyline(schematicGuide, fractions[pointIndex])
          }));
        });

      const halo = svgNode("path", {
        class: "mobility-halo",
        stroke: "#05070a",
        "stroke-width": style.halo
      });
      const visible = svgNode("path", {
        class: "mobility-line",
        stroke: line.system === "suburbano" && pathIndex === 1
          ? (officialSuburbanoAifa?.stroke || "#F7B9A3")
          : line.color,
        "stroke-width": style.width,
        filter: "url(#metro-soft-glow)"
      });
      if (line.system === "suburbano" && pathIndex === 1) {
        visible.setAttribute("stroke-dasharray", "6 3");
      }
      if (style.dash) visible.setAttribute("stroke-dasharray", style.dash);
      mobilityHalosLayer.appendChild(halo);
      mobilityLinesLayer.appendChild(visible);
      return { pathData, pairedSegments, pairedPolyline, halo, visible };
    });
    mobilityRouteRenderers.push({ line, parts });
  });

  const halosLayer = root.querySelector('[data-layer="halos"]');
  const linesLayer = root.querySelector('[data-layer="lines"]');
  const lineRenderers = [];

  data.lines.forEach(line => {
    const officialMetroPath = officialPaths.find(path =>
      path.system === "metro" && path.line === line.id
    );
    const pairedSegments = line.segments.map((segment, segmentIndex) => {
      const from = stationById.get(line.station_ids[segmentIndex]);
      const to = stationById.get(line.station_ids[segmentIndex + 1]);
      const geoPoints = segment.map(point => projection(point));
      if (!officialMetroPath) {
        return pairPolylines([from.schematic, to.schematic], geoPoints);
      }
      const startFraction = nearestProjectionOnPolyline(
        from.schematic,
        officialMetroPath.mappedPoints
      ).fraction;
      const endFraction = nearestProjectionOnPolyline(
        to.schematic,
        officialMetroPath.mappedPoints
      ).fraction;
      const schematicPoints = slicePolyline(
        officialMetroPath.mappedPoints,
        startFraction,
        endFraction
      );
      return pairPolylines(schematicPoints, geoPoints);
    });

    const halo = svgNode("path", {
      class: "metro-halo",
      stroke: "#05070a",
      "stroke-width": line.id === "B" ? 12 : 11
    });
    halosLayer.appendChild(halo);

    const paths = [];
    if (line.id === "B") {
      const outer = svgNode("path", {
        class: "metro-b-line",
        stroke: "#afafad",
        "stroke-width": 7.2,
        filter: "url(#metro-soft-glow)"
      });
      const inner = svgNode("path", {
        class: "metro-b-line",
        stroke: officialColors.B,
        "stroke-width": 3.2
      });
      linesLayer.appendChild(outer);
      linesLayer.appendChild(inner);
      paths.push(outer, inner);
    } else {
      const path = svgNode("path", {
        class: "metro-line",
        stroke: officialColors[line.id] || line.color,
        "stroke-width": 6.4,
        filter: "url(#metro-soft-glow)"
      });
      linesLayer.appendChild(path);
      paths.push(path);
    }
    lineRenderers.push({ line, pairedSegments, halo, paths });
  });

  const systemNames = {
    metrobus: "Metrobús",
    cablebus: "Cablebús",
    suburbano: "Tren Suburbano"
  };
  const suburbanoRoute = data.additionalLines.find(line => line.system === "suburbano");
  const aifaStationIds = new Set(
    suburbanoRoute && suburbanoRoute.paths[1]
      ? suburbanoRoute.paths[1].station_ids.slice(1)
      : []
  );

  function mobilityPresentation(station) {
    if (station.system === "suburbano" && aifaStationIds.has(station.id)) {
      return { icon: "felipeAngeles", name: "Tren Felipe Ángeles" };
    }
    return {
      icon: station.system,
      name: systemNames[station.system] || station.system
    };
  }

  function stationTooltipIcon(station, fallbackIconKey) {
    const crop = stationIconAtlasMeta.icons[station.id];
    if (crop) {
      const icon = svgNode("svg", {
        class: "metro-tip-icon",
        viewBox: `${crop.x} ${crop.y} ${crop.size} ${crop.size}`,
        preserveAspectRatio: "xMidYMid meet",
        "aria-hidden": "true",
        focusable: "false"
      });
      icon.appendChild(svgNode("image", {
        href: stationIconAtlas,
        x: 0,
        y: 0,
        width: stationIconAtlasMeta.width,
        height: stationIconAtlasMeta.height,
        preserveAspectRatio: "none"
      }));
      return icon;
    }

    const icon = document.createElement("img");
    icon.className = "metro-tip-icon";
    icon.src = networkIcons[fallbackIconKey] || networkIcons.metro;
    icon.alt = "";
    icon.setAttribute("aria-hidden", "true");
    return icon;
  }

  function showTooltip(copy, station, fallbackIconKey) {
    detail.textContent = copy;
    const row = document.createElement("span");
    row.className = "metro-tip-row";
    const label = document.createElement("span");
    label.textContent = copy;
    row.appendChild(stationTooltipIcon(station, fallbackIconKey));
    row.appendChild(label);
    tip.replaceChildren(row);
    tip.setAttribute("aria-hidden", "false");
    tip.classList.add("is-visible");
  }

  const mobilityStationLayer = root.querySelector('[data-layer="mobility-stations"]');
  data.additionalStations.forEach(station => {
    const route = data.additionalLines.find(line =>
      line.system === station.system && station.lines.includes(line.id)
    );
    const color = route ? route.color : "#d6dce2";
    const group = svgNode("g", {
      "aria-label": `${station.name}; ${systemNames[station.system] || station.system} ${station.lines.join(", ")}`
    });
    let mark;
    if (station.system === "cablebus") {
      mark = svgNode("rect", {
        class: "mobility-station-mark",
        x: -2.8, y: -2.8, width: 5.6, height: 5.6, rx: 0.8,
        fill: "#05070a", stroke: color, "stroke-width": 1.35
      });
    } else {
      mark = svgNode("circle", {
        class: "mobility-station-mark",
        r: station.system === "suburbano" ? 3.25 : 1.9,
        fill: "#05070a",
        stroke: color,
        "stroke-width": station.system === "suburbano" ? 1.65 : 1.15
      });
    }
    const hit = svgNode("circle", {
      class: "mobility-station-hit",
      r: station.system === "suburbano" ? 8 : 6.5
    });
    group.appendChild(mark);
    group.appendChild(hit);
    mobilityStationLayer.appendChild(group);
    station.group = group;

    function moveMobilityTip(event) {
      const rect = stage.getBoundingClientRect();
      const width = tip.offsetWidth || 180;
      const height = tip.offsetHeight || 42;
      const x = clamp(event.clientX - rect.left, width / 2 + 8, rect.width - width / 2 - 8);
      const y = clamp(event.clientY - rect.top, height + 14, rect.height - 8);
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    }

    hit.addEventListener("pointerenter", event => {
      const presentation = mobilityPresentation(station);
      const copy = `${station.name} · ${presentation.name} ${station.lines.join(" · ")}`;
      showTooltip(copy, station, presentation.icon);
      moveMobilityTip(event);
    });
    hit.addEventListener("pointermove", moveMobilityTip);
    hit.addEventListener("pointerleave", () => {
      tip.classList.remove("is-visible");
      tip.setAttribute("aria-hidden", "true");
      detail.textContent = `${data.meta.total_lines || 23} líneas · ${data.meta.systems || 4} sistemas`;
    });
  });

  const stationsLayer = root.querySelector('[data-layer="stations"]');
  data.stations.forEach(station => {
    const group = svgNode("g", {
      "aria-label": `${station.name}; línea${station.lines.length > 1 ? "s" : ""} ${station.lines.join(", ")}`
    });
    const dot = svgNode("circle", {
      class: "metro-station-dot",
      r: station.interchange ? 5.1 : 2.35,
      fill: "#05070a",
      stroke: "#f4f7fa",
      "stroke-width": station.interchange ? 2.3 : 1.05
    });
    const hit = svgNode("circle", {
      class: "metro-station-hit",
      r: station.interchange ? 11 : 8
    });
    group.appendChild(dot);
    group.appendChild(hit);
    stationsLayer.appendChild(group);
    station.group = group;

    function showStation(event) {
      const lineText = station.lines.join(" · ");
      const copy = `${station.name} · ${station.lines.length > 1 ? "líneas" : "línea"} ${lineText}`;
      showTooltip(copy, station, "metro");
      moveTip(event);
    }

    function moveTip(event) {
      const rect = stage.getBoundingClientRect();
      const width = tip.offsetWidth || 180;
      const height = tip.offsetHeight || 42;
      const x = clamp(event.clientX - rect.left, width / 2 + 8, rect.width - width / 2 - 8);
      const y = clamp(event.clientY - rect.top, height + 14, rect.height - 8);
      tip.style.left = `${x}px`;
      tip.style.top = `${y}px`;
    }

    hit.addEventListener("pointerenter", showStation);
    hit.addEventListener("pointermove", moveTip);
    hit.addEventListener("pointerleave", () => {
      tip.classList.remove("is-visible");
      tip.setAttribute("aria-hidden", "true");
      detail.textContent = `${data.meta.total_lines || 23} líneas · ${data.meta.systems || 4} sistemas`;
    });
  });

  function readableTextColor(hex) {
    const value = hex.replace("#", "");
    const r = parseInt(value.slice(0, 2), 16) || 0;
    const g = parseInt(value.slice(2, 4), 16) || 0;
    const b = parseInt(value.slice(4, 6), 16) || 0;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 154 ? "#05070a" : "#ffffff";
  }

  function createOfficialBadge(iconKey, routeLabel, routeColor, options = {}) {
    const group = svgNode("g");
    const iconSize = 19;
    const gap = routeLabel ? 2.5 : 0;
    const routeWidth = routeLabel ? (String(routeLabel).length > 1 ? 20 : 17) : 0;
    const totalWidth = iconSize + gap + routeWidth;
    const clearance = 3;
    const plateHeight = iconSize + clearance * 2;
    const plate = svgNode("rect", {
      class: "badge-clearance",
      x: (-totalWidth / 2 - clearance).toFixed(2),
      y: (-plateHeight / 2).toFixed(2),
      width: (totalWidth + clearance * 2).toFixed(2),
      height: plateHeight.toFixed(2),
      rx: 3.8,
      fill: "#05070a"
    });
    group.appendChild(plate);
    group.setAttribute("data-badge-width", (totalWidth + clearance * 2).toFixed(2));
    group.setAttribute("data-badge-height", plateHeight.toFixed(2));
    const icon = svgNode("image", {
      class: options.className || "metro-badge",
      x: (-totalWidth / 2).toFixed(2),
      y: (-iconSize / 2).toFixed(2),
      width: iconSize,
      height: iconSize,
      href: networkIcons[iconKey],
      preserveAspectRatio: "xMidYMid meet"
    });
    group.appendChild(icon);
    if (routeLabel) {
      const x = -totalWidth / 2 + iconSize + gap;
      const rect = svgNode("rect", {
        class: options.className || "metro-badge",
        x: x.toFixed(2),
        y: "-8.5",
        width: routeWidth,
        height: 17,
        rx: 2.4,
        fill: options.fill || routeColor,
        stroke: options.stroke || "#05070a",
        "stroke-width": options.strokeWidth || 1.5
      });
      const text = svgNode("text", {
        class: "metro-badge-text",
        x: (x + routeWidth / 2).toFixed(2),
        y: 0,
        fill: options.textColor || readableTextColor(options.fill || routeColor),
        "font-size": String(routeLabel).length > 1 ? 9 : 10.5
      });
      text.textContent = routeLabel;
      group.appendChild(rect);
      group.appendChild(text);
    }
    return group;
  }

  const badgeLayer = root.querySelector('[data-layer="badges"]');
  const badgeRenderers = [];
  data.lines.forEach(line => {
    if (line.station_ids.length < 2) return;
    [0, line.station_ids.length - 1].forEach(endpointIndex => {
      const neighborIndex = endpointIndex === 0 ? 1 : endpointIndex - 1;
      const color = officialColors[line.id] || line.color;
      const group = createOfficialBadge("metro", line.id, color, line.id === "B" ? {
        fill: "#afafad",
        stroke: officialColors.B,
        strokeWidth: 1.8,
        textColor: "#05070a"
      } : {});
      badgeLayer.appendChild(group);
      badgeRenderers.push({
        group,
        endpoint: stationById.get(line.station_ids[endpointIndex]),
        neighbor: stationById.get(line.station_ids[neighborIndex]),
        system: "metro",
        lineId: line.id,
        distance: 24
      });
    });
  });

  const mobilityBadgeLayer = root.querySelector('[data-layer="mobility-badges"]');
  const mobilityBadgeRenderers = [];
  data.additionalLines.forEach(line => {
    const neighbors = new Map();
    line.paths.forEach(pathData => {
      for (let index = 1; index < pathData.station_ids.length; index += 1) {
        const from = pathData.station_ids[index - 1];
        const to = pathData.station_ids[index];
        if (!neighbors.has(from)) neighbors.set(from, new Set());
        if (!neighbors.has(to)) neighbors.set(to, new Set());
        neighbors.get(from).add(to);
        neighbors.get(to).add(from);
      }
    });
    [...neighbors.entries()]
      .filter(([, adjacent]) => adjacent.size === 1)
      .forEach(([stationId, adjacent]) => {
        const endpoint = stationForId(stationId);
        const neighbor = stationForId([...adjacent][0]);
        if (!endpoint || !neighbor) return;
        const isAifa = line.system === "suburbano" && aifaStationIds.has(stationId);
        const iconKey = isAifa ? "felipeAngeles" : line.system;
        const routeLabel = line.system === "suburbano" ? null : line.id;
        const group = createOfficialBadge(iconKey, routeLabel, line.color, {
          className: "mobility-badge"
        });
        mobilityBadgeLayer.appendChild(group);
        mobilityBadgeRenderers.push({
          group,
          endpoint,
          neighbor,
          system: line.system,
          lineId: line.id,
          distance: 22
        });
      });
  });

  function normalizedNodeName(name) {
    return String(name || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  const badgeSystemOrder = new Map([
    ["metro", 0],
    ["metrobus", 1],
    ["cablebus", 2],
    ["suburbano", 3]
  ]);

  function compareBadgeMembers(first, second) {
    const systemDifference = (badgeSystemOrder.get(first.system) ?? 9)
      - (badgeSystemOrder.get(second.system) ?? 9);
    if (systemDifference) return systemDifference;
    return String(first.lineId).localeCompare(String(second.lineId), "es", {
      numeric: true,
      sensitivity: "base"
    });
  }

  const allBadgeRenderers = [...badgeRenderers, ...mobilityBadgeRenderers];
  const badgeClustersByNode = new Map();
  allBadgeRenderers.forEach(badge => {
    badge.width = Number(badge.group.getAttribute("data-badge-width")) || 47;
    badge.height = Number(badge.group.getAttribute("data-badge-height")) || 25;
    badge.nodeKey = normalizedNodeName(badge.endpoint?.name);
    if (!badgeClustersByNode.has(badge.nodeKey)) badgeClustersByNode.set(badge.nodeKey, []);
    badgeClustersByNode.get(badge.nodeKey).push(badge);
  });

  const badgeClusters = [...badgeClustersByNode.entries()]
    .map(([nodeKey, members]) => {
      members.sort(compareBadgeMembers);
      members.forEach((member, index) => {
        member.group.setAttribute("data-node-key", nodeKey);
        member.group.setAttribute("data-stack-index", String(index + 1));
        member.group.setAttribute("data-stack-size", String(members.length));
      });
      return { nodeKey, members };
    })
    .sort((first, second) =>
      second.members.length - first.members.length
      || first.nodeKey.localeCompare(second.nodeKey, "es")
    );

  const reduceBadgeMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  let badgeAnimationFrame = 0;

  function setRenderedBadgePosition(badge, position) {
    badge.displayPosition = [...position];
    badge.group.setAttribute(
      "transform",
      `translate(${position[0].toFixed(2)} ${position[1].toFixed(2)})`
    );
    badge.group.setAttribute("data-render-x", position[0].toFixed(2));
    badge.group.setAttribute("data-render-y", position[1].toFixed(2));
  }

  function scheduleBadgePositionAnimation() {
    if (reduceBadgeMotion) {
      allBadgeRenderers.forEach(badge => {
        if (badge.targetPosition) setRenderedBadgePosition(badge, badge.targetPosition);
      });
      return;
    }
    if (badgeAnimationFrame) return;
    const animate = () => {
      let remainsInMotion = false;
      allBadgeRenderers.forEach(badge => {
        if (!badge.targetPosition) return;
        if (!badge.displayPosition) {
          setRenderedBadgePosition(badge, badge.targetPosition);
          return;
        }
        const dx = badge.targetPosition[0] - badge.displayPosition[0];
        const dy = badge.targetPosition[1] - badge.displayPosition[1];
        if (Math.hypot(dx, dy) <= 0.12) {
          setRenderedBadgePosition(badge, badge.targetPosition);
          return;
        }
        setRenderedBadgePosition(badge, [
          badge.displayPosition[0] + dx * 0.32,
          badge.displayPosition[1] + dy * 0.32
        ]);
        remainsInMotion = true;
      });
      badgeAnimationFrame = remainsInMotion ? requestAnimationFrame(animate) : 0;
    };
    badgeAnimationFrame = requestAnimationFrame(animate);
  }

  function segmentIntersectsRect(start, end, rect) {
    if (
      Math.max(start[0], end[0]) < rect.left
      || Math.min(start[0], end[0]) > rect.right
      || Math.max(start[1], end[1]) < rect.top
      || Math.min(start[1], end[1]) > rect.bottom
    ) return false;
    let near = 0;
    let far = 1;
    const dx = end[0] - start[0];
    const dy = end[1] - start[1];
    const p = [-dx, dx, -dy, dy];
    const q = [
      start[0] - rect.left,
      rect.right - start[0],
      start[1] - rect.top,
      rect.bottom - start[1]
    ];
    for (let index = 0; index < 4; index += 1) {
      if (Math.abs(p[index]) < 1e-9) {
        if (q[index] < 0) return false;
        continue;
      }
      const ratio = q[index] / p[index];
      if (p[index] < 0) near = Math.max(near, ratio);
      else far = Math.min(far, ratio);
      if (near > far) return false;
    }
    return true;
  }

  function rectanglesOverlap(first, second, gap = 0) {
    return !(
      first.right + gap <= second.left
      || second.right + gap <= first.left
      || first.bottom + gap <= second.top
      || second.bottom + gap <= first.top
    );
  }

  function angleDifference(first, second) {
    return Math.abs(Math.atan2(Math.sin(first - second), Math.cos(first - second)));
  }

  function positionBadgeClusters(routePolylines) {
    const routeSegments = [];
    routePolylines.forEach(points => {
      for (let index = 1; index < points.length; index += 1) {
        routeSegments.push([points[index - 1], points[index]]);
      }
    });
    const collisionCellSize = 40;
    const routeSegmentGrid = new Map();
    routeSegments.forEach((segment, segmentIndex) => {
      const minX = Math.floor(Math.min(segment[0][0], segment[1][0]) / collisionCellSize);
      const maxX = Math.floor(Math.max(segment[0][0], segment[1][0]) / collisionCellSize);
      const minY = Math.floor(Math.min(segment[0][1], segment[1][1]) / collisionCellSize);
      const maxY = Math.floor(Math.max(segment[0][1], segment[1][1]) / collisionCellSize);
      for (let cellX = minX; cellX <= maxX; cellX += 1) {
        for (let cellY = minY; cellY <= maxY; cellY += 1) {
          const key = `${cellX}:${cellY}`;
          if (!routeSegmentGrid.has(key)) routeSegmentGrid.set(key, []);
          routeSegmentGrid.get(key).push(segmentIndex);
        }
      }
    });

    function rectIntersectsRoute(rect) {
      const minX = Math.floor(rect.left / collisionCellSize);
      const maxX = Math.floor(rect.right / collisionCellSize);
      const minY = Math.floor(rect.top / collisionCellSize);
      const maxY = Math.floor(rect.bottom / collisionCellSize);
      const checkedSegments = new Set();
      for (let cellX = minX; cellX <= maxX; cellX += 1) {
        for (let cellY = minY; cellY <= maxY; cellY += 1) {
          const candidates = routeSegmentGrid.get(`${cellX}:${cellY}`) || [];
          for (const segmentIndex of candidates) {
            if (checkedSegments.has(segmentIndex)) continue;
            checkedSegments.add(segmentIndex);
            const segment = routeSegments[segmentIndex];
            if (segmentIntersectsRect(segment[0], segment[1], rect)) return true;
          }
        }
      }
      return false;
    }

    const placedRects = [];
    const directions = Array.from({ length: 16 }, (_, index) => index * Math.PI / 8);
    const radialOffsets = [0, 8, 18, 30, 45, 64, 88, 116, 148, 184];

    badgeClusters.forEach(cluster => {
      const node = cluster.members.reduce((total, member) => [
        total[0] + member.endpoint.current[0],
        total[1] + member.endpoint.current[1]
      ], [0, 0]).map(value => value / cluster.members.length);

      const outward = cluster.members.reduce((total, member) => {
        const dx = member.endpoint.current[0] - member.neighbor.current[0];
        const dy = member.endpoint.current[1] - member.neighbor.current[1];
        const length = Math.hypot(dx, dy) || 1;
        total[0] += dx / length;
        total[1] += dy / length;
        return total;
      }, [0, 0]);
      if (Math.hypot(outward[0], outward[1]) < 0.18) {
        outward[0] = node[0] - 500;
        outward[1] = node[1] - 395;
      }
      const preferredAngle = Math.atan2(outward[1], outward[0]);
      const orderedDirections = directions
        .map(angle => ({ angle, difference: angleDifference(angle, preferredAngle) }))
        .sort((first, second) => first.difference - second.difference || first.angle - second.angle);

      const stackGap = 3;
      const stackWidth = Math.max(...cluster.members.map(member => member.width));
      const stackHeight = cluster.members.reduce((sum, member) => sum + member.height, 0)
        + stackGap * (cluster.members.length - 1);
      const predictedCenter = cluster.lastCenter && cluster.lastNode ? [
        cluster.lastCenter[0] + node[0] - cluster.lastNode[0],
        cluster.lastCenter[1] + node[1] - cluster.lastNode[1]
      ] : null;
      const candidateCenters = [];
      const seenCandidates = new Set();

      function addCandidate(center, difference) {
        const key = `${center[0].toFixed(2)}:${center[1].toFixed(2)}`;
        if (seenCandidates.has(key)) return;
        seenCandidates.add(key);
        candidateCenters.push({ center, difference });
      }

      if (predictedCenter) {
        const localRadii = [0, 4, 8, 12, 18, 26, 38, 54, 74, 100];
        localRadii.forEach(localRadius => {
          if (localRadius === 0) {
            const angle = Math.atan2(predictedCenter[1] - node[1], predictedCenter[0] - node[0]);
            addCandidate(predictedCenter, angleDifference(angle, preferredAngle));
            return;
          }
          directions.forEach(angle => {
            const center = [
              predictedCenter[0] + Math.cos(angle) * localRadius,
              predictedCenter[1] + Math.sin(angle) * localRadius
            ];
            const nodeAngle = Math.atan2(center[1] - node[1], center[0] - node[0]);
            addCandidate(center, angleDifference(nodeAngle, preferredAngle));
          });
        });
      }

      orderedDirections.forEach(({ angle, difference }) => {
        const ux = Math.cos(angle);
        const uy = Math.sin(angle);
        const baseRadius = 8 + Math.abs(ux) * stackWidth / 2 + Math.abs(uy) * stackHeight / 2;
        radialOffsets.forEach(radialOffset => {
          const radius = baseRadius + radialOffset;
          addCandidate([node[0] + ux * radius, node[1] + uy * radius], difference);
        });
      });

      let best = null;

      candidateCenters.forEach(({ center, difference }) => {
          const radius = Math.hypot(center[0] - node[0], center[1] - node[1]);
          let cursorY = center[1] - stackHeight / 2;
          const memberRects = cluster.members.map(member => {
            const rect = {
              left: center[0] - member.width / 2,
              right: center[0] + member.width / 2,
              top: cursorY,
              bottom: cursorY + member.height,
              member
            };
            cursorY = rect.bottom + stackGap;
            return rect;
          });

          let boundaryOverflow = 0;
          memberRects.forEach(rect => {
            boundaryOverflow += Math.max(0, 8 - rect.left);
            boundaryOverflow += Math.max(0, rect.right - 992);
            boundaryOverflow += Math.max(0, 8 - rect.top);
            boundaryOverflow += Math.max(0, rect.bottom - 782);
          });

          let lineCollisions = 0;
          memberRects.forEach(rect => {
            const clearanceRect = {
              left: rect.left - 2.5,
              right: rect.right + 2.5,
              top: rect.top - 2.5,
              bottom: rect.bottom + 2.5
            };
            if (rectIntersectsRoute(clearanceRect)) {
              lineCollisions += 1;
            }
          });

          let badgeCollisions = 0;
          memberRects.forEach(rect => {
            placedRects.forEach(placed => {
              if (rectanglesOverlap(rect, placed, 3)) badgeCollisions += 1;
            });
          });

          const movementDistance = predictedCenter
            ? Math.hypot(center[0] - predictedCenter[0], center[1] - predictedCenter[1])
            : 0;
          const score = boundaryOverflow * 1e8
            + badgeCollisions * 1e7
            + lineCollisions * 1e6
            + movementDistance * 40
            + difference * 30
            + radius * 0.05;
          if (!best || score < best.score) {
            best = {
              score,
              center,
              memberRects,
              boundaryOverflow,
              badgeCollisions,
              lineCollisions
            };
          }
      });

      cluster.lastCenter = [...best.center];
      cluster.lastNode = [...node];
      best.memberRects.forEach((rect, index) => {
        const x = (rect.left + rect.right) / 2;
        const y = (rect.top + rect.bottom) / 2;
        rect.member.targetPosition = [x, y];
        if (!rect.member.displayPosition) setRenderedBadgePosition(rect.member, rect.member.targetPosition);
        rect.member.group.setAttribute("data-layout-x", x.toFixed(2));
        rect.member.group.setAttribute("data-layout-y", y.toFixed(2));
        rect.member.group.setAttribute("data-stack-position", `${index + 1}/${cluster.members.length}`);
        rect.member.group.setAttribute("data-line-collisions", String(best.lineCollisions));
        rect.member.group.setAttribute("data-badge-collisions", String(best.badgeCollisions));
        rect.member.group.setAttribute("data-boundary-overflow", best.boundaryOverflow.toFixed(2));
        placedRects.push(rect);
      });
    });
    scheduleBadgePositionAnimation();
  }

  function update(value) {
    const raw = clamp(value, 0, 1);
    const t = smootherstep(raw);
    const baseOpacity = smootherstep((raw - 0.18) / 0.82);
    const roadOpacity = smootherstep((raw - 0.34) / 0.66);
    const labelOpacity = smootherstep((raw - 0.48) / 0.52);
    gridLayer.setAttribute("opacity", (0.54 * (1 - smootherstep(raw / 0.7))).toFixed(3));
    boroughLayer.setAttribute("opacity", baseOpacity.toFixed(3));
    edomexLayer.setAttribute("opacity", baseOpacity.toFixed(3));
    edomexLabelsLayer.setAttribute("opacity", (0.9 * labelOpacity).toFixed(3));
    roadsLayer.setAttribute("opacity", roadOpacity.toFixed(3));
    root.querySelector('[data-layer="north"]').setAttribute("opacity", baseOpacity.toFixed(3));
    const mobilityMorphOpacity = smootherstep(raw / 0.18);
    const officialSchematicOpacity = 1 - mobilityMorphOpacity;
    officialSchematicHalosLayer.setAttribute("opacity", officialSchematicOpacity.toFixed(3));
    officialSchematicLinesLayer.setAttribute("opacity", officialSchematicOpacity.toFixed(3));
    mobilityHalosLayer.setAttribute("opacity", mobilityMorphOpacity.toFixed(3));
    mobilityLinesLayer.setAttribute("opacity", mobilityMorphOpacity.toFixed(3));

    data.stations.forEach(station => {
      station.current[0] = station.schematic[0] + (station.geo[0] - station.schematic[0]) * t;
      station.current[1] = station.schematic[1] + (station.geo[1] - station.schematic[1]) * t;
      station.group.setAttribute("transform", `translate(${station.current[0].toFixed(2)} ${station.current[1].toFixed(2)})`);
    });

    data.additionalStations.forEach(station => {
      station.current[0] = station.schematic[0] + (station.geo[0] - station.schematic[0]) * t;
      station.current[1] = station.schematic[1] + (station.geo[1] - station.schematic[1]) * t;
      station.group.setAttribute("transform", `translate(${station.current[0].toFixed(2)} ${station.current[1].toFixed(2)})`);
    });

    const currentRoutePolylines = [];
    if (officialSchematicOpacity > 0.02) {
      officialPaths.forEach(path => currentRoutePolylines.push(path.mappedPoints));
    }
    mobilityRouteRenderers.forEach(renderer => {
      renderer.parts.forEach(part => {
        const points = part.pairedPolyline
          ? part.pairedPolyline.map(pair => [
              pair.schematic[0] + (pair.geo[0] - pair.schematic[0]) * t,
              pair.schematic[1] + (pair.geo[1] - pair.schematic[1]) * t
            ])
          : [];
        if (!part.pairedPolyline) {
          part.pairedSegments.forEach((segment, segmentIndex) => {
            segment.forEach((pair, pointIndex) => {
              if (segmentIndex > 0 && pointIndex === 0) return;
              points.push([
                pair.schematic[0] + (pair.geo[0] - pair.schematic[0]) * t,
                pair.schematic[1] + (pair.geo[1] - pair.schematic[1]) * t
              ]);
            });
          });
        }
        const d = pathString(points);
        part.halo.setAttribute("d", d);
        part.visible.setAttribute("d", d);
        currentRoutePolylines.push(points);
      });
    });

    lineRenderers.forEach(renderer => {
      const points = [];
      renderer.pairedSegments.forEach((segment, segmentIndex) => {
        segment.forEach((pair, pointIndex) => {
          if (segmentIndex > 0 && pointIndex === 0) return;
          points.push([
            pair.schematic[0] + (pair.geo[0] - pair.schematic[0]) * t,
            pair.schematic[1] + (pair.geo[1] - pair.schematic[1]) * t
          ]);
        });
      });
      const d = pathString(points);
      renderer.halo.setAttribute("d", d);
      renderer.paths.forEach(path => path.setAttribute("d", d));
      currentRoutePolylines.push(points);
    });

    positionBadgeClusters(currentRoutePolylines);

    const percent = Math.round(raw * 100);
    const state = percent === 0 ? "Plano integrado" : percent === 100 ? "Geografía" : "Transición";
    modeLabel.textContent = `${state} · ${percent}%`;
    slider.setAttribute("aria-valuetext", `${state}, ${percent} por ciento`);
  }

  slider.addEventListener("input", event => update(Number(event.target.value) / 100));
  update(0);
</script>

    </main>
  </div>
