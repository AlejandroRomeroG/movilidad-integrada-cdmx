  function normalizedNodeName(name) {
    return String(name || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  const badgeSystemOrder = new Map([
    ["metro", 0],
    ["metrobus", 1],
    ["cablebus", 2],
    ["suburbano", 3]
  ]);

  function compareBadgeMembers(first, second) {
    const systemDifference = (badgeSystemOrder.get(first.system) ?? 9)
      - (badgeSystemOrder.get(second.system) ?? 9);
    if (systemDifference) return systemDifference;
    return String(first.lineId).localeCompare(String(second.lineId), "es", {
      numeric: true,
      sensitivity: "base"
    });
  }

  const allBadgeRenderers = [...badgeRenderers, ...mobilityBadgeRenderers];
  const badgeClustersByNode = new Map();
  allBadgeRenderers.forEach(badge => {
    badge.width = Number(badge.group.getAttribute("data-badge-width")) || 40;
    badge.height = Number(badge.group.getAttribute("data-badge-height")) || 21;
    badge.nodeKey = normalizedNodeName(badge.endpoint?.name);
    if (!badgeClustersByNode.has(badge.nodeKey)) badgeClustersByNode.set(badge.nodeKey, []);
    badgeClustersByNode.get(badge.nodeKey).push(badge);
  });

  const badgeClusters = [...badgeClustersByNode.entries()]
    .map(([nodeKey, members]) => {
      members.sort(compareBadgeMembers);
      members.forEach((member, index) => {
        member.group.setAttribute("data-node-key", nodeKey);
        member.group.setAttribute("data-stack-index", String(index + 1));
        member.group.setAttribute("data-stack-size", String(members.length));
      });
      return { nodeKey, members };
    })
    .sort((first, second) =>
      second.members.length - first.members.length
      || first.nodeKey.localeCompare(second.nodeKey, "es")
    );

  const reduceBadgeMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  let badgeAnimationFrame = 0;

  function pauseBadgePositionAnimation() {
    if (!badgeAnimationFrame) return;
    cancelAnimationFrame(badgeAnimationFrame);
    badgeAnimationFrame = 0;
  }

  function setRenderedBadgePosition(badge, position) {
    badge.displayPosition = [...position];
    badge.group.setAttribute(
      "transform",
      `translate(${position[0].toFixed(2)} ${position[1].toFixed(2)})`
    );
    badge.group.setAttribute("data-render-x", position[0].toFixed(2));
    badge.group.setAttribute("data-render-y", position[1].toFixed(2));
  }

  function scheduleBadgePositionAnimation() {
    if (stage.dataset.interacting === "true") return;
    const hasPendingBadges = allBadgeRenderers.some(badge => {
      if (!badge.targetPosition) return false;
      if (!badge.displayPosition) return true;
      return Math.hypot(
        badge.targetPosition[0] - badge.displayPosition[0],
        badge.targetPosition[1] - badge.displayPosition[1]
      ) > 0.01;
    });
    if (!hasPendingBadges) return;
    if (reduceBadgeMotion) {
      allBadgeRenderers.forEach(badge => {
        if (badge.targetPosition) setRenderedBadgePosition(badge, badge.targetPosition);
      });
      return;
    }
    if (badgeAnimationFrame) return;
    const animate = () => {
      let remainsInMotion = false;
      allBadgeRenderers.forEach(badge => {
        if (!badge.targetPosition) return;
        if (!badge.displayPosition) {
          setRenderedBadgePosition(badge, badge.targetPosition);
          return;
        }
        const dx = badge.targetPosition[0] - badge.displayPosition[0];
        const dy = badge.targetPosition[1] - badge.displayPosition[1];
        if (Math.hypot(dx, dy) <= 0.12) {
          setRenderedBadgePosition(badge, badge.targetPosition);
          return;
        }
        setRenderedBadgePosition(badge, [
          badge.displayPosition[0] + dx * 0.32,
          badge.displayPosition[1] + dy * 0.32
        ]);
        remainsInMotion = true;
      });
      badgeAnimationFrame = remainsInMotion ? requestAnimationFrame(animate) : 0;
    };
    badgeAnimationFrame = requestAnimationFrame(animate);
  }

  function segmentIntersectsRect(start, end, rect) {
    if (
      Math.max(start[0], end[0]) < rect.left
      || Math.min(start[0], end[0]) > rect.right
      || Math.max(start[1], end[1]) < rect.top
      || Math.min(start[1], end[1]) > rect.bottom
    ) return false;
    let near = 0;
    let far = 1;
    const dx = end[0] - start[0];
    const dy = end[1] - start[1];
    const p = [-dx, dx, -dy, dy];
    const q = [
      start[0] - rect.left,
      rect.right - start[0],
      start[1] - rect.top,
      rect.bottom - start[1]
    ];
    for (let index = 0; index < 4; index += 1) {
      if (Math.abs(p[index]) < 1e-9) {
        if (q[index] < 0) return false;
        continue;
      }
      const ratio = q[index] / p[index];
      if (p[index] < 0) near = Math.max(near, ratio);
      else far = Math.min(far, ratio);
      if (near > far) return false;
    }
    return true;
  }

  function rectanglesOverlap(first, second, gap = 0) {
    return !(
      first.right + gap <= second.left
      || second.right + gap <= first.left
      || first.bottom + gap <= second.top
      || second.bottom + gap <= first.top
    );
  }

  function angleDifference(first, second) {
    return Math.abs(Math.atan2(Math.sin(first - second), Math.cos(first - second)));
  }

  function positionBadgeClusters(routePolylines) {
    const routeSegments = [];
    routePolylines.forEach(points => {
      for (let index = 1; index < points.length; index += 1) {
        routeSegments.push([points[index - 1], points[index]]);
      }
    });
    const collisionCellSize = 40;
    const routeSegmentGrid = new Map();
    routeSegments.forEach((segment, segmentIndex) => {
      const minX = Math.floor(Math.min(segment[0][0], segment[1][0]) / collisionCellSize);
      const maxX = Math.floor(Math.max(segment[0][0], segment[1][0]) / collisionCellSize);
      const minY = Math.floor(Math.min(segment[0][1], segment[1][1]) / collisionCellSize);
      const maxY = Math.floor(Math.max(segment[0][1], segment[1][1]) / collisionCellSize);
      for (let cellX = minX; cellX <= maxX; cellX += 1) {
        for (let cellY = minY; cellY <= maxY; cellY += 1) {
          const key = `${cellX}:${cellY}`;
          if (!routeSegmentGrid.has(key)) routeSegmentGrid.set(key, []);
          routeSegmentGrid.get(key).push(segmentIndex);
        }
      }
    });

    function rectIntersectsRoute(rect) {
      const minX = Math.floor(rect.left / collisionCellSize);
      const maxX = Math.floor(rect.right / collisionCellSize);
      const minY = Math.floor(rect.top / collisionCellSize);
      const maxY = Math.floor(rect.bottom / collisionCellSize);
      const checkedSegments = new Set();
      for (let cellX = minX; cellX <= maxX; cellX += 1) {
        for (let cellY = minY; cellY <= maxY; cellY += 1) {
          const candidates = routeSegmentGrid.get(`${cellX}:${cellY}`) || [];
          for (const segmentIndex of candidates) {
            if (checkedSegments.has(segmentIndex)) continue;
            checkedSegments.add(segmentIndex);
            const segment = routeSegments[segmentIndex];
            if (segmentIntersectsRect(segment[0], segment[1], rect)) return true;
          }
        }
      }
      return false;
    }

    const placedRects = [];
    const directions = Array.from({ length: 32 }, (_, index) => index * Math.PI / 16);
    const localDirections = directions.filter((_, index) => index % 4 === 0);
    const radialOffsets = [0, 4, 9, 15, 22, 30, 40, 52, 66, 82, 100, 120, 144];
    const safeBounds = { left: 16, right: 984, top: 16, bottom: 774 };

    badgeClusters.forEach(cluster => {
      const node = cluster.members.reduce((total, member) => [
        total[0] + member.endpoint.current[0],
        total[1] + member.endpoint.current[1]
      ], [0, 0]).map(value => value / cluster.members.length);

      const outward = cluster.members.reduce((total, member) => {
        const dx = member.endpoint.current[0] - member.neighbor.current[0];
        const dy = member.endpoint.current[1] - member.neighbor.current[1];
        const length = Math.hypot(dx, dy) || 1;
        total[0] += dx / length;
        total[1] += dy / length;
        return total;
      }, [0, 0]);
      if (Math.hypot(outward[0], outward[1]) < 0.18) {
        outward[0] = node[0] - 500;
        outward[1] = node[1] - 395;
      }
      const preferredAngle = Math.atan2(outward[1], outward[0]);
      const orderedDirections = directions
        .map(angle => ({ angle, difference: angleDifference(angle, preferredAngle) }))
        .sort((first, second) => first.difference - second.difference || first.angle - second.angle);

      const stackGap = 2.25;
      const stackWidth = Math.max(...cluster.members.map(member => member.width));
      const stackHeight = cluster.members.reduce((sum, member) => sum + member.height, 0)
        + stackGap * (cluster.members.length - 1);
      const predictedCenter = cluster.lastCenter && cluster.lastNode ? [
        cluster.lastCenter[0] + node[0] - cluster.lastNode[0],
        cluster.lastCenter[1] + node[1] - cluster.lastNode[1]
      ] : null;
      const candidateCenters = [];
      const seenCandidates = new Set();

      function addCandidate(center, difference) {
        const boundedCenter = [
          clamp(center[0], safeBounds.left + stackWidth / 2, safeBounds.right - stackWidth / 2),
          clamp(center[1], safeBounds.top + stackHeight / 2, safeBounds.bottom - stackHeight / 2)
        ];
        const key = `${boundedCenter[0].toFixed(2)}:${boundedCenter[1].toFixed(2)}`;
        if (seenCandidates.has(key)) return;
        seenCandidates.add(key);
        candidateCenters.push({ center: boundedCenter, difference });
      }

      if (predictedCenter) {
        const localRadii = [0, 4, 8, 14, 22, 34, 50, 70, 96];
        localRadii.forEach(localRadius => {
          if (localRadius === 0) {
            const angle = Math.atan2(predictedCenter[1] - node[1], predictedCenter[0] - node[0]);
            addCandidate(predictedCenter, angleDifference(angle, preferredAngle));
            return;
          }
          localDirections.forEach(angle => {
            const center = [
              predictedCenter[0] + Math.cos(angle) * localRadius,
              predictedCenter[1] + Math.sin(angle) * localRadius
            ];
            const nodeAngle = Math.atan2(center[1] - node[1], center[0] - node[0]);
            addCandidate(center, angleDifference(nodeAngle, preferredAngle));
          });
        });
      }

      orderedDirections.forEach(({ angle, difference }) => {
        const ux = Math.cos(angle);
        const uy = Math.sin(angle);
        const baseRadius = 8 + Math.abs(ux) * stackWidth / 2 + Math.abs(uy) * stackHeight / 2;
        radialOffsets.forEach(radialOffset => {
          const radius = baseRadius + radialOffset;
          addCandidate([node[0] + ux * radius, node[1] + uy * radius], difference);
        });
      });

      candidateCenters.forEach(candidate => {
        candidate.radius = Math.hypot(
          candidate.center[0] - node[0],
          candidate.center[1] - node[1]
        );
        candidate.movementDistance = predictedCenter
          ? Math.hypot(
              candidate.center[0] - predictedCenter[0],
              candidate.center[1] - predictedCenter[1]
            )
          : 0;
        candidate.softScore = candidate.movementDistance * 0.6
          + candidate.difference * 12
          + candidate.radius * 2;
      });
      candidateCenters.sort((first, second) => first.softScore - second.softScore);

      let best = null;

      for (const candidate of candidateCenters) {
          if (
            best
            && best.boundaryOverflow === 0
            && best.badgeCollisions === 0
            && best.lineCollisions === 0
            && candidate.softScore >= best.score
          ) break;
          const { center, radius } = candidate;
          let cursorY = center[1] - stackHeight / 2;
          const memberRects = cluster.members.map(member => {
            const rect = {
              left: center[0] - member.width / 2,
              right: center[0] + member.width / 2,
              top: cursorY,
              bottom: cursorY + member.height,
              member
            };
            cursorY = rect.bottom + stackGap;
            return rect;
          });

          let boundaryOverflow = 0;
          memberRects.forEach(rect => {
            boundaryOverflow += Math.max(0, safeBounds.left - rect.left);
            boundaryOverflow += Math.max(0, rect.right - safeBounds.right);
            boundaryOverflow += Math.max(0, safeBounds.top - rect.top);
            boundaryOverflow += Math.max(0, rect.bottom - safeBounds.bottom);
          });

          let lineCollisions = 0;
          memberRects.forEach(rect => {
            const clearanceRect = {
              left: rect.left - 6.5,
              right: rect.right + 6.5,
              top: rect.top - 6.5,
              bottom: rect.bottom + 6.5
            };
            if (rectIntersectsRoute(clearanceRect)) {
              lineCollisions += 1;
            }
          });

          let badgeCollisions = 0;
          memberRects.forEach(rect => {
            placedRects.forEach(placed => {
              if (rectanglesOverlap(rect, placed, 2.25)) badgeCollisions += 1;
            });
          });

          const score = boundaryOverflow * 1e8
            + badgeCollisions * 1e7
            + lineCollisions * 1e6
            + candidate.softScore;
          if (!best || score < best.score) {
            best = {
              score,
              center,
              memberRects,
              boundaryOverflow,
              badgeCollisions,
              lineCollisions
            };
          }
      }

      cluster.lastCenter = [...best.center];
      cluster.lastNode = [...node];
      best.memberRects.forEach((rect, index) => {
        const x = (rect.left + rect.right) / 2;
        const y = (rect.top + rect.bottom) / 2;
        rect.member.targetPosition = [x, y];
        if (!rect.member.displayPosition) setRenderedBadgePosition(rect.member, rect.member.targetPosition);
        rect.member.group.setAttribute("data-layout-x", x.toFixed(2));
        rect.member.group.setAttribute("data-layout-y", y.toFixed(2));
        rect.member.group.setAttribute("data-stack-position", `${index + 1}/${cluster.members.length}`);
        rect.member.group.setAttribute("data-line-collisions", String(best.lineCollisions));
        rect.member.group.setAttribute("data-badge-collisions", String(best.badgeCollisions));
        rect.member.group.setAttribute("data-boundary-overflow", best.boundaryOverflow.toFixed(2));
        rect.member.group.setAttribute("data-node-x", node[0].toFixed(2));
        rect.member.group.setAttribute("data-node-y", node[1].toFixed(2));
        rect.member.group.setAttribute(
          "data-stack-radius",
          Math.hypot(best.center[0] - node[0], best.center[1] - node[1]).toFixed(2)
        );
        placedRects.push(rect);
      });
    });
    scheduleBadgePositionAnimation();
  }

  function update(value) {
    const raw = clamp(value, 0, 1);
    const t = smootherstep(raw);
    updateCameraFrame(raw);
    const baseOpacity = smootherstep((raw - 0.18) / 0.82);
    const roadOpacity = smootherstep((raw - 0.34) / 0.66);
    const labelOpacity = smootherstep((raw - 0.48) / 0.52);
    gridLayer.setAttribute("opacity", (0.54 * (1 - smootherstep(raw / 0.7))).toFixed(3));
    boroughLayer.setAttribute("opacity", baseOpacity.toFixed(3));
    edomexLayer.setAttribute("opacity", baseOpacity.toFixed(3));
    edomexLabelsLayer.setAttribute("opacity", (0.9 * labelOpacity).toFixed(3));
    roadsLayer.setAttribute("opacity", roadOpacity.toFixed(3));
    root.querySelector('[data-layer="north"]').setAttribute("opacity", baseOpacity.toFixed(3));
    const mobilityMorphOpacity = 1;
    const officialSchematicOpacity = 0;
    officialSchematicHalosLayer.setAttribute("opacity", officialSchematicOpacity.toFixed(3));
    officialSchematicLinesLayer.setAttribute("opacity", officialSchematicOpacity.toFixed(3));
    mobilityHalosLayer.setAttribute("opacity", mobilityMorphOpacity.toFixed(3));
    mobilityLinesLayer.setAttribute("opacity", mobilityMorphOpacity.toFixed(3));

    data.stations.forEach(station => {
      station.current[0] = station.schematic[0] + (station.geo[0] - station.schematic[0]) * t;
      station.current[1] = station.schematic[1] + (station.geo[1] - station.schematic[1]) * t;
      station.group.setAttribute("transform", `translate(${station.current[0].toFixed(2)} ${station.current[1].toFixed(2)})`);
    });

    data.additionalStations.forEach(station => {
      station.current[0] = station.schematic[0] + (station.geo[0] - station.schematic[0]) * t;
      station.current[1] = station.schematic[1] + (station.geo[1] - station.schematic[1]) * t;
      station.group.setAttribute("transform", `translate(${station.current[0].toFixed(2)} ${station.current[1].toFixed(2)})`);
    });
    stationScreenGeometryCache = null;

    const currentRoutePolylines = [];
    mobilityRouteRenderers.forEach(renderer => {
      renderer.parts.forEach(part => {
        const points = [];
        part.pairedSegments.forEach((segment, segmentIndex) => {
          segment.forEach((pair, pointIndex) => {
            if (segmentIndex > 0 && pointIndex === 0) return;
            points.push([
              pair.schematic[0] + (pair.geo[0] - pair.schematic[0]) * t,
              pair.schematic[1] + (pair.geo[1] - pair.schematic[1]) * t
            ]);
          });
        });
        const d = pathString(points);
        part.halo.setAttribute("d", d);
        part.visible.setAttribute("d", d);
        currentRoutePolylines.push(points);
      });
    });

    lineRenderers.forEach(renderer => {
      const points = [];
      renderer.pairedSegments.forEach((segment, segmentIndex) => {
        segment.forEach((pair, pointIndex) => {
          if (segmentIndex > 0 && pointIndex === 0) return;
          points.push([
            pair.schematic[0] + (pair.geo[0] - pair.schematic[0]) * t,
            pair.schematic[1] + (pair.geo[1] - pair.schematic[1]) * t
          ]);
        });
      });
      const d = pathString(points);
      renderer.halo.setAttribute("d", d);
      renderer.paths.forEach(path => path.setAttribute("d", d));
      currentRoutePolylines.push(points);
    });

    positionBadgeClusters(currentRoutePolylines);

    const percent = Math.round(raw * 100);
    const state = percent === 0
      ? "Esquema"
      : percent === 100
        ? "Geografía"
        : `Transición, ${percent} por ciento`;
    slider.setAttribute("aria-valuetext", state);
  }

  let sliderUpdateFrame = 0;
  let pendingSliderValue = 0;
  slider.addEventListener("input", event => {
    cancelZoomAnimation();
    hideMapTooltip();
    pendingSliderValue = Number(event.target.value) / 100;
    if (sliderUpdateFrame) return;
    sliderUpdateFrame = requestAnimationFrame(() => {
      sliderUpdateFrame = 0;
      update(pendingSliderValue);
    });
  });
  update(0);
</script>

    </main>
  </div>
</body>
</html>
